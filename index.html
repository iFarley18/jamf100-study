":"The app's name is about moving to a new Mac — accounts, apps, and files from an old Mac or a Time Machine backup."},{"id":"D7","exam":"D","topic":"APL","q":"Where are MDM push certificates created and renewed?","opts":["Apple Push Certificates Portal","App Store Connect","Jamf Nation","Apple Configurator"],"ans":0,"why":"Push certificates are issued at the Apple Push Certificates Portal (identity.apple.com) using a CSR from Jamf Pro.","hint":"These certificates are issued on Apple's own push-certificate website, using a request file that Jamf Pro creates — not in App Store Connect or Jamf Nation."},{"id":"D8","exam":"D","topic":"APL","q":"Which file do you download from Apple Business or Apple School Manager to connect an Apps and Books location to Jamf Pro?","opts":["A content token (.vpptoken)","A server token (.p7m)","A push certificate (.pem)","A configuration profile (.mobileconfig)"],"ans":0,"why":"The content token links a purchasing location; the .p7m server token is for ADE.","hint":"There are two different tokens. The one for Apps and Books is the content token. The other (.p7m) is for Automated Device Enrollment."},{"id":"D9","exam":"D","topic":"APL","q":"Which description best fits Declarative Device Management (DDM)?","opts":["Devices apply configurations on their own and proactively report status changes to the server","The server polls each device for every setting","Managing devices without enrolling them","A tool for imaging Macs"],"ans":0,"why":"With DDM the device keeps its own state and reports changes, instead of waiting for commands.","hint":"In this model the device keeps its own state and reports changes, instead of the server having to ask about every setting."},{"id":"D10","exam":"D","topic":"APL","q":"In Apple Business or Apple School Manager, what does federated authentication allow?","opts":["Users sign in to Managed Apple Accounts with credentials from an identity provider such as Microsoft Entra ID or Google Workspace","Devices skip Setup Assistant","Apps install without licenses","Push certificates renew automatically"],"ans":0,"why":"Federation links Managed Apple Accounts to the organization's identity provider.","hint":"This lets people sign in to their Managed Apple Account with the same work or school login they already use, such as Microsoft Entra ID or Google."},{"id":"D11","exam":"D","topic":"APL","q":"Devices enrolled through Automated Device Enrollment can be set so users cannot remove the MDM profile.","opts":["True","False"],"ans":0,"why":"A PreStage can prevent removal of the MDM profile for ADE devices.","hint":"Think about a PreStage setting for Automated Device Enrollment devices: can IT stop the user from removing the management profile?"},{"id":"D12","exam":"D","topic":"APL","q":"In Apple Business, how is a device linked to Jamf Pro for Automated Device Enrollment?","opts":["Its serial number is assigned to the MDM server that represents Jamf Pro","The user installs Jamf Pro from the App Store","IT emails the serial number to Apple","The device is cabled to the Jamf Pro server"],"ans":0,"why":"Device assignment in Apple Business tells the device which MDM server to enroll with.","hint":"In Apple Business, the link is the device's serial number assigned to the MDM server that stands for your Jamf Pro — not an App Store install."},{"id":"D13","exam":"D","topic":"JPI","q":"In Jamf Pro Settings, where do you add Jamf Pro user accounts and groups?","opts":["System > User accounts and groups","Computer management > Policies","Global > Re-enrollment","Self Service > Branding"],"ans":0,"why":"Jamf Pro accounts, groups and their privileges are managed under System settings.","hint":"Look under System settings, where Jamf Pro accounts, groups, and their privileges are managed — not under policies or Self Service."},{"id":"D14","exam":"D","topic":"JPI","q":"What is a Jamf Account used for?","opts":["Signing in to Jamf products and resources such as Jamf training and Jamf Nation","Enrolling iPhones","Creating Managed Apple Accounts","Purchasing apps for devices"],"ans":0,"why":"A Jamf Account is your identity for Jamf services, training and community.","hint":"This is your login for Jamf's own websites and training, not a way to enroll devices or create Apple Accounts."},{"id":"D15","exam":"D","topic":"JPI","q":"A Jamf Pro policy can be assigned to only one category.","opts":["True","False"],"ans":0,"why":"Each object takes a single category used for organizing it.","hint":"Think about how objects are organized in lists and in Self Service: how many of those labels can one policy have?"},{"id":"D16","exam":"D","topic":"JPI","q":"Where do you add installer packages in Jamf Pro so policies can deploy them?","opts":["Settings > Computer management > Packages","Computers > Inventory","Devices > Configuration profiles","Users > Static user groups"],"ans":0,"why":"Packages are uploaded under Computer management and stored on the distribution point.","hint":"Packages are added in Settings, under computer management — then they live on the distribution point so policies can use them."},{"id":"D17","exam":"D","topic":"JPI","q":"Where in Jamf Pro Settings are network segments configured?","opts":["Network > Network segments","Global > Event logs","Self Service > macOS","System > SMTP server"],"ans":0,"why":"Network segments are part of the Network settings.","hint":"The name is a clue: these IP ranges live under the Network settings, not under Self Service or email."},{"id":"D18","exam":"D","topic":"JPI","q":"What does a distribution point hold in Jamf Pro?","opts":["Packages that policies install","Push certificates","Smart group criteria","Device inventory"],"ans":0,"why":"Distribution points such as JCDS host packages; inventory and settings live in the Jamf Pro database.","hint":"This is a file-hosting location for installers that policies can put on Macs. Inventory and settings stay in the Jamf Pro database."},{"id":"D19","exam":"D","topic":"ENR","q":"Which devices can use Automated Device Enrollment?","opts":["Devices in Apple Business or Apple School Manager, bought from Apple or a participating reseller or added with Apple Configurator","Any device with an Apple Account","Only devices bought from a carrier","Any device on company Wi-Fi"],"ans":0,"why":"ADE needs the device's serial number in the organization's Apple Business or Apple School Manager.","hint":"The device's serial number has to be in the organization's Apple Business or Apple School Manager — from Apple, a participating reseller, or added with Apple Configurator."},{"id":"D20","exam":"D","topic":"ENR","q":"Which enrollment method gives a zero-touch experience, enrolling a new device during setup straight out of the box?","opts":["Automated Device Enrollment","User-initiated enrollment","Enrollment invitations","Account-driven User Enrollment"],"ans":0,"why":"ADE enrolls during Setup Assistant with no IT touch.","hint":"The zero-touch method enrolls during the first-run Setup Assistant, out of the box, with no IT visit needed."},{"id":"D21","exam":"D","topic":"ENR","q":"When a device is added to Apple Business with Apple Configurator, how long is the provisional period in which the user can release it?","opts":["24 hours","30 days","90 days","1 year"],"ans":1,"why":"Devices added with Apple Configurator have a 30-day provisional period.","hint":"When a device is added with Apple Configurator, the user has a short window — measured in days, not a year — to release it."},{"id":"D22","exam":"D","topic":"ENR","q":"Why does User Approved MDM matter on macOS?","opts":["Some features, such as PPPC and kernel extension approval, need enrollment approved by a user or done through ADE","It lets users remove the MDM profile","It is required for Spotlight","It speeds up Wi-Fi"],"ans":0,"why":"ADE enrollment, or a user approving the MDM profile, unlocks security-sensitive payloads.","hint":"Some sensitive Mac settings, such as Full Disk Access approvals, only work if enrollment was approved by a user or done through Automated Device Enrollment."},{"id":"D23","exam":"D","topic":"ENR","q":"In a PreStage enrollment, what are the Setup Assistant options for?","opts":["Choosing which setup panes users see or skip","Choosing Dock apps","Setting the push certificate","Setting the inventory schedule"],"ans":0,"why":"PreStages let you skip panes such as Siri or Screen Time to speed up setup.","hint":"These options choose which first-run screens the person sees or skips, such as Siri or Screen Time."},{"id":"D24","exam":"D","topic":"ENR","q":"Which enrollment method requires the user to visit an enrollment URL or follow an invitation, rather than enrolling during Setup Assistant?","opts":["User-initiated enrollment","Automated Device Enrollment","PreStage enrollment","Zero-touch deployment"],"ans":0,"why":"User-initiated enrollment is started by the user after setup.","hint":"This method starts after the device is already set up: the person opens a link or an invitation, rather than enrolling during Setup Assistant."},{"id":"D25","exam":"D","topic":"INV","q":"Advanced searches can be saved so you can run them again later.","opts":["True","False"],"ans":0,"why":"Saved advanced searches can be rerun and shared with other admins.","hint":"Think about whether you can keep an advanced search and run it again later, and whether other admins can use it too."},{"id":"D26","exam":"D","topic":"INV","q":"Where in a mobile device's inventory record do you send a remote command such as Lock Device?","opts":["The Management tab","The Purchasing section","The History tab","Settings > Global"],"ans":0,"why":"Management lists available MDM commands for that device.","hint":"On that device's record, look for the tab about managing it — that is where remote commands such as Lock live, not History or Purchasing."},{"id":"D27","exam":"D","topic":"INV","q":"What is the difference between a computer's Last Check-in and Last Inventory Update?","opts":["Last Check-in is the last contact to check for policies; Last Inventory Update is the last full inventory submission","They always match","Last Check-in is only for iPhones","Last Inventory Update is the enrollment date"],"ans":0,"why":"Computers check in often but submit full inventory less frequently.","hint":"One timestamp is a quick 'anything for me to do?' visit. The other is the last time the Mac sent a full set of facts about itself. They are not always the same."},{"id":"D28","exam":"D","topic":"INV","q":"Which inventory section tracks details such as PO number, vendor and warranty expiration?","opts":["Purchasing","Hardware","Operating System","Disk Encryption"],"ans":0,"why":"Purchasing holds procurement and warranty data.","hint":"This section is about buying the device: purchase order, vendor, and warranty dates — not hardware specs."},{"id":"D29","exam":"D","topic":"INV","q":"What are extension attributes used for?","opts":["Collecting custom inventory data Jamf Pro does not collect by default","Extending the push certificate","Extending policy deadlines","Adding disk space"],"ans":0,"why":"EAs add custom fields to inventory, filled by a script, text, a pop-up menu or the directory.","hint":"These are extra inventory fields you add for facts Jamf Pro does not already collect, filled by a script, text, a menu, or the directory."},{"id":"D30","exam":"D","topic":"GRP","q":"IT wants to find Macs with less than 20 GB free space and fix them automatically. What is the best tool?","opts":["A smart group with a disk space criterion, used to scope a policy","A static group updated weekly","A category","A network segment"],"ans":0,"why":"Smart groups update as inventory changes, so the policy reaches each Mac that qualifies.","hint":"You want a list that updates itself as free space changes, then a policy aimed at that list — not a hand-updated list or a category."},{"id":"D31","exam":"D","topic":"GRP","q":"Jamf Pro supports smart and static user groups as well as device groups.","opts":["True","False"],"ans":0,"why":"There are computer, mobile device and user groups, each smart or static.","hint":"Besides computer and mobile device groups, think about whether you can also group people, and whether those groups can be rule-based or hand-picked."},{"id":"D32","exam":"D","topic":"GRP","q":"A smart group has 'Operating System Version less than 15.0' AND 'Building is HQ'. Which computer is a member?","opts":["A Mac on macOS 14.6 at HQ","A Mac on macOS 15.1 at HQ","A Mac on macOS 14.6 in Austin","A Mac on macOS 15.1 in Austin"],"ans":0,"why":"With AND, both conditions must be true.","hint":"When two rules are joined with AND, both have to be true. Check the macOS version and the building together."},{"id":"D33","exam":"D","topic":"GRP","q":"What happens if a computer smart group has no criteria?","opts":["It includes all computers","It includes no computers","It cannot be saved","It includes only new computers"],"ans":0,"why":"With nothing to filter on, every computer matches.","hint":"If you set no rules at all, there is nothing to filter on. Who is left in the list?"},{"id":"D34","exam":"D","topic":"CFG","q":"Which payload can disable features such as the camera or AirDrop?","opts":["Restrictions","Wi-Fi","Certificate","Login Window"],"ans":0,"why":"Restrictions turns features off or on.","hint":"The payload that turns features off — such as the camera or AirDrop — is named after those limits."},{"id":"D35","exam":"D","topic":"CFG","q":"Which payload preconfigures a wireless network so devices join it automatically?","opts":["Wi-Fi","VPN","Proxy","Mail"],"ans":0,"why":"The Wi-Fi payload holds the SSID, security type and credentials.","hint":"The payload is named after the wireless network itself: network name, security type, and the password or certificate."},{"id":"D36","exam":"D","topic":"CFG","q":"You can upload an existing .mobileconfig file to Jamf Pro instead of building the profile from scratch.","opts":["True","False"],"ans":0,"why":"Profiles can be uploaded and then scoped like any other.","hint":"Think about whether Jamf Pro will accept a profile file you already have, then let you aim it at devices like any other profile."},{"id":"D37","exam":"D","topic":"CFG","q":"How can a configuration profile scoped to a computer group be limited to certain directory users?","opts":["Add the users as Limitations in scope","Put the users in a category","Add them to a network segment","It cannot be done"],"ans":0,"why":"Limitations narrow a scope by directory users, groups or network segments.","hint":"Scope has a way to narrow who gets something, using directory users or groups, without taking them out as exclusions."},{"id":"D38","exam":"D","topic":"CFG","q":"Which payload configures items in the macOS Dock?","opts":["Dock","Login Window","Restrictions","Energy Saver"],"ans":0,"why":"The Dock payload sets Dock items and behavior.","hint":"The payload is named after the row of apps and folders at the edge of the Mac screen."},{"id":"D39","exam":"D","topic":"DDM","q":"Because of Declarative Device Management, devices can apply some settings based on criteria even when offline.","opts":["True","False"],"ans":0,"why":"Declarations can activate on device conditions without waiting for the server.","hint":"In this newer model, some rules can turn on from conditions on the device itself, without waiting to hear from the server. What does that mean if the device is offline?"},{"id":"D40","exam":"D","topic":"DDM","q":"What can you do with Compliance Benchmarks results?","opts":["View compliance scores in the rule report and export them as CSV","Only view them on the device","Send them to Apple","Nothing; results are hidden"],"ans":0,"why":"Rule reports show scores and can be exported, with audit documents available to download.","hint":"You can read scores in a rule report and export them as a spreadsheet file. The results are not stuck only on the device."},{"id":"D41","exam":"D","topic":"POL","q":"What can users do with Self Service on a Mac?","opts":["Install approved apps and run IT-provided items on demand, without admin rights","Change Jamf Pro settings","Create smart groups","Renew the push certificate"],"ans":0,"why":"Self Service is an IT-curated catalog that runs with management privileges.","hint":"On a Mac, this app is a catalog IT sets up so people can install approved items themselves, without needing admin rights."},{"id":"D42","exam":"D","topic":"POL","q":"Jamf Self Service is also available for iPhone and iPad.","opts":["True","False"],"ans":0,"why":"Self Service for iOS and iPadOS offers apps, profiles and books.","hint":"Think about whether that same catalog exists for iPhone and iPad, for apps, profiles, and books."},{"id":"D43","exam":"D","topic":"POL","q":"Before a policy can install a package, where must the package be?","opts":["Uploaded to a distribution point such as JCDS","On the user's desktop","In Apple Business","In the push certificate"],"ans":0,"why":"Policies download packages from a distribution point.","hint":"The installer has to be on a distribution point — for example Jamf's cloud one — before a policy can download it. The desktop or Apple Business is not that place."},{"id":"D44","exam":"D","topic":"POL","q":"Which frequency runs a policy once for each user who logs in to a given computer?","opts":["Once per user per computer","Once per computer","Once per user","Ongoing"],"ans":0,"why":"Once per user per computer repeats for each new user on that Mac.","hint":"Read the frequency name carefully: once for each person who logs in, and it is tied to that particular computer."},{"id":"D45","exam":"D","topic":"POL","q":"What does the Restart Options payload control?","opts":["Whether and when the computer restarts after the policy","Self Service branding","Wi-Fi settings","Inventory timing"],"ans":0,"why":"Restart Options sets restart behavior for logged-in and logged-out states.","hint":"This payload is about what the Mac does after the policy: whether it restarts, and how that differs if someone is logged in."},{"id":"D46","exam":"D","topic":"POL","q":"Which trigger runs a policy as soon as a user logs in?","opts":["Login","Logout","Recurring Check-in","Custom"],"ans":0,"why":"The Login trigger fires when a user logs in.","hint":"The trigger is named after the moment a user signs in to the Mac."},{"id":"D47","exam":"D","topic":"SCR","q":"Scripts run by Jamf Pro policies run as root.","opts":["True","False"],"ans":0,"why":"The jamf binary runs scripts as root, so use $3 or another method to act as the logged-in user.","hint":"Policies run scripts with the highest system permission. If you need to act as the person at the keyboard, that takes an extra step, such as a special parameter."},{"id":"D48","exam":"D","topic":"SCR","q":"Which Terminal command lists all files in the current folder, including hidden ones, with details?","opts":["`ls -la`","`pwd`","`cd ~`","`mkdir -p`"],"ans":0,"why":"`-l` gives a long listing and `-a` includes hidden dot files.","hint":"You want a listing of the current folder that includes hidden files and shows details. Two short flags on the list command do that."},{"id":"D49","exam":"D","topic":"SCR","q":"Where can you give friendly labels to script parameters 4 to 11 so they show in a policy?","opts":["The script's Options tab in Jamf Pro","The policy's Restart Options","The package's info","Settings > SMTP"],"ans":0,"why":"Parameter labels set in the script record appear as field names in the policy.","hint":"Those friendly names are set on the script itself, on the tab for options, so they show up as field labels inside the policy."}]}};
(function () {
  "use strict";

  const STORE = "jamf100-study-v1";
  const LIMIT = 3600;
  const PASS = 40;
  const LETTERS = ["A", "B", "C", "D"];
  const EXAM_IDS = ["A", "B", "C", "D"];
  const TOPICS = BANK.topics;
  const TOPIC_KEYS = Object.keys(TOPICS);

  function hash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
    return h;
  }

  function prep(row) {
    const opts = row.opts.slice();
    let ans = row.ans;
    if (opts.length !== 2) {
      const correct = opts[ans];
      const rest = opts.filter(function (_, i) { return i !== ans; });
      const pos = hash(row.q) % opts.length;
      opts.splice(0, opts.length, ...rest.slice(0, pos), correct, ...rest.slice(pos));
      ans = pos;
    }
    return {
      id: row.id,
      exam: row.exam,
      topic: row.topic,
      q: row.q,
      opts: opts,
      ans: ans,
      why: row.why,
      hint: row.hint || ""
    };
  }

  const CARDS = [];
  EXAM_IDS.forEach(function (ex) {
    (BANK.exams[ex] || []).forEach(function (row) {
      CARDS.push(prep(row));
    });
  });
  const BY_ID = {};
  CARDS.forEach(function (c) { BY_ID[c.id] = c; });

  function toPlain(why) {
    const reps = [
      [/\bmSCP\b/g, "mSCP (the macOS Security Compliance Project)"],
      [/\bAPNs\b/g, "APNs (Apple's push service)"],
      [/\bMDM\b/g, "MDM (device management)"],
      [/\bADE\b/g, "ADE (Automated Device Enrollment)"],
      [/\bSMTP\b/g, "SMTP (the email-sending setting)"],
      [/\bJCDS\b/g, "JCDS (Jamf's cloud file server for packages)"],
      [/\bPPPC\b/g, "PPPC (privacy permission approvals)"],
      [/\bDDM\b/g, "DDM (Declarative Device Management)"],
      [/\bLDAP\b/g, "LDAP (a company directory)"],
      [/\bUDID\b/g, "UDID (a unique device identifier)"],
      [/\bSIP\b/g, "SIP (System Integrity Protection)"],
      [/\bSSO\b/g, "SSO (single sign-on)"],
      [/\bCSR\b/g, "CSR (a certificate request file)"],
      [/\bGSX\b/g, "GSX (Apple's service and warranty system)"],
      [/\bEAs\b/g, "extension attributes"]
    ];
    let s = why;
    for (let i = 0; i < reps.length; i++) s = s.replace(reps[i][0], reps[i][1]);
    return s;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function rich(s) {
    return escapeHtml(s).split("`").map(function (part, i) {
      return i % 2 === 1 ? "<code>" + part + "</code>" : part;
    }).join("");
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function mmss(s) {
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function emptyPractice() {
    const o = {};
    EXAM_IDS.forEach(function (ex) {
      o[ex] = { answers: {}, submitted: false, startedAt: 0 };
    });
    return o;
  }

  function loadSaved() {
    const base = { missed: [], close: [], bestStreak: 0, practice: emptyPractice() };
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return base;
      const p = JSON.parse(raw);
      const missed = Array.isArray(p.missed) ? p.missed.filter(function (x) { return typeof x === "string"; }) : [];
      const close = Array.isArray(p.close) ? p.close.filter(function (x) { return typeof x === "string"; }) : [];
      const bestStreak = typeof p.bestStreak === "number" && p.bestStreak > 0 ? p.bestStreak : 0;
      const practice = emptyPractice();
      if (p.practice && typeof p.practice === "object") {
        EXAM_IDS.forEach(function (ex) {
          const src = p.practice[ex] || {};
          const answers = {};
          if (src.answers && typeof src.answers === "object") {
            Object.keys(src.answers).forEach(function (k) {
              const n = Number(src.answers[k]);
              if (Number.isInteger(n)) answers[k] = n;
            });
          }
          practice[ex] = {
            answers: answers,
            submitted: !!src.submitted,
            startedAt: typeof src.startedAt === "number" ? src.startedAt : 0
          };
        });
      }
      return { missed: missed, close: close, bestStreak: bestStreak, practice: practice };
    } catch (e) {
      return base;
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify(saved));
    } catch (e) { /* ignore quota or private mode */ }
  }

  let saved = loadSaved();
  let tab = "quiz";
  let screen = "home";
  let kind = "exam";
  let exam = "A";
  let section = "DF";
  let randomSize = 10;
  let shuffleOn = true;
  let timerOn = false;
  let deck = [];
  let index = 0;
  let hinted = false;
  let revealed = false;
  let marks = {};
  let streak = 0;
  let bestInSession = 0;
  let startedAt = 0;
  let timedRound = false;
  let practiceExam = "A";
  let practiceTimerOn = false;
  let practiceIndex = 0;
  let practiceFilter = "missed";
  let now = Date.now();
  let ticker = null;

  function pileCount() {
    return saved.missed.length + saved.close.length;
  }

  function examCount(ex) {
    return CARDS.filter(function (c) { return c.exam === ex; }).length;
  }

  function topicCount(t) {
    return CARDS.filter(function (c) { return c.topic === t; }).length;
  }

  function previewCount() {
    if (kind === "exam") return examCount(exam);
    if (kind === "section") return topicCount(section);
    if (kind === "random") return Math.min(randomSize, CARDS.length);
    return pileCount();
  }

  function remainingFor(start) {
    if (!start) return LIMIT;
    return Math.max(0, LIMIT - Math.floor((now - start) / 1000));
  }

  function ensureTicker() {
    const quizTicking = tab === "quiz" && screen === "quiz" && timedRound && startedAt;
    const prac = saved.practice[practiceExam];
    const pracTicking = tab === "practice" && practiceTimerOn && prac && prac.startedAt && !prac.submitted;
    if (quizTicking || pracTicking) {
      if (!ticker) ticker = setInterval(onTick, 1000);
    } else if (ticker) {
      clearInterval(ticker);
      ticker = null;
    }
  }

  function onTick() {
    now = Date.now();
    const el = document.getElementById("timer-display");
    if (tab === "quiz" && timedRound && startedAt) {
      const left = remainingFor(startedAt);
      if (el) el.textContent = mmss(left) + " left";
      if (left === 0) {
        if (Object.keys(marks).length === 0) goQuizHome();
        else finishQuiz();
        return;
      }
    }
    if (tab === "practice") {
      const prac = saved.practice[practiceExam];
      if (practiceTimerOn && prac.startedAt && !prac.submitted) {
        const left = remainingFor(prac.startedAt);
        if (el) el.textContent = mmss(left) + " left";
        if (left === 0) {
          prac.submitted = true;
          persist();
          render();
          return;
        }
      }
    }
  }

  function startQuiz() {
    let list = [];
    if (kind === "exam") list = CARDS.filter(function (c) { return c.exam === exam; });
    else if (kind === "section") list = CARDS.filter(function (c) { return c.topic === section; });
    else if (kind === "random") list = shuffle(CARDS).slice(0, randomSize);
    else {
      const want = {};
      saved.missed.forEach(function (id) { want[id] = true; });
      saved.close.forEach(function (id) { want[id] = true; });
      list = CARDS.filter(function (c) { return want[c.id]; });
    }
    if (kind !== "random" && shuffleOn) list = shuffle(list);
    if (!list.length) return;
    const useTimer = timerOn && list.length === 50;
    deck = list;
    index = 0;
    marks = {};
    streak = 0;
    bestInSession = 0;
    hinted = false;
    revealed = false;
    timedRound = useTimer;
    now = Date.now();
    startedAt = useTimer ? now : 0;
    screen = "quiz";
    render();
  }

  function goQuizHome() {
    screen = "home";
    deck = [];
    index = 0;
    hinted = false;
    revealed = false;
    timedRound = false;
    startedAt = 0;
    render();
  }

  function finishQuiz() {
    if (Object.keys(marks).length === 0) {
      goQuizHome();
      return;
    }
    screen = "summary";
    render();
  }

  function applyMark(m) {
    const current = deck[index];
    if (!current) return;
    const id = current.id;
    marks[id] = m;
    const nextStreak = m === "got" ? streak + 1 : 0;
    streak = nextStreak;
    if (nextStreak > bestInSession) bestInSession = nextStreak;
    saved.missed = saved.missed.filter(function (x) { return x !== id; });
    saved.close = saved.close.filter(function (x) { return x !== id; });
    if (m === "missed") saved.missed.push(id);
    if (m === "close") saved.close.push(id);
    if (nextStreak > saved.bestStreak) saved.bestStreak = nextStreak;
    persist();
    if (index + 1 >= deck.length) {
      screen = "summary";
    } else {
      index += 1;
      hinted = false;
      revealed = false;
    }
    render();
  }

  function startMissed() {
    kind = "missed";
    const want = {};
    saved.missed.forEach(function (id) { want[id] = true; });
    saved.close.forEach(function (id) { want[id] = true; });
    let list = CARDS.filter(function (c) { return want[c.id]; });
    if (shuffleOn) list = shuffle(list);
    if (!list.length) return;
    deck = list;
    index = 0;
    marks = {};
    streak = 0;
    bestInSession = 0;
    hinted = false;
    revealed = false;
    timedRound = false;
    startedAt = 0;
    screen = "quiz";
    render();
  }

  function practiceItems() {
    return CARDS.filter(function (c) { return c.exam === practiceExam; });
  }

  function practiceScore(items, answers) {
    let n = 0;
    items.forEach(function (it, i) {
      if (answers[i] === it.ans) n += 1;
    });
    return n;
  }

  function resetPractice() {
    saved.practice[practiceExam] = { answers: {}, submitted: false, startedAt: practiceTimerOn ? Date.now() : 0 };
    practiceIndex = 0;
    persist();
    render();
  }

  function submitPractice() {
    const prac = saved.practice[practiceExam];
    prac.submitted = true;
    practiceIndex = 0;
    persist();
    render();
  }

  function countsFromMarks() {
    const ids = Object.keys(marks);
    return {
      got: ids.filter(function (id) { return marks[id] === "got"; }).length,
      close: ids.filter(function (id) { return marks[id] === "close"; }).length,
      missed: ids.filter(function (id) { return marks[id] === "missed"; }).length,
      answered: ids.length
    };
  }

  function topicSummary() {
    const rows = [];
    TOPIC_KEYS.forEach(function (k) {
      const cards = deck.filter(function (c) { return c.topic === k && marks[c.id]; });
      if (!cards.length) return;
      const got = cards.filter(function (c) { return marks[c.id] === "got"; }).length;
      const close = cards.filter(function (c) { return marks[c.id] === "close"; }).length;
      const missed = cards.filter(function (c) { return marks[c.id] === "missed"; }).length;
      rows.push({ k: k, total: cards.length, got: got, close: close, missed: missed, weak: missed + close });
    });
    rows.sort(function (a, b) { return b.weak - a.weak || a.got / a.total - b.got / b.total; });
    return rows;
  }

  function practiceTopicRows(items, answers) {
    const rows = [];
    TOPIC_KEYS.forEach(function (k) {
      const subset = items.filter(function (it) { return it.topic === k; });
      if (!subset.length) return;
      let right = 0;
      subset.forEach(function (it) {
        const i = items.indexOf(it);
        if (answers[i] === it.ans) right += 1;
      });
      rows.push({ k: k, total: subset.length, right: right, missed: subset.length - right });
    });
    rows.sort(function (a, b) { return b.missed - a.missed || a.right / a.total - b.right / b.total; });
    return rows;
  }

      if (prac.submitted) return "";
      const answered = Object.keys(prac.answers).length;
      const showTimer = practiceTimerOn && (prac.startedAt || true);
      const left = (practiceTimerOn && prac.startedAt)
        ? " · <span id=\"timer-display\">" + mmss(remainingFor(prac.startedAt)) + " left</span>"
        : (practiceTimerOn ? " · <span id=\"timer-display\">60:00 left</span>" : "");
      return '<div class="dock"><div class="dock-inner"><div class="status">Exam ' + practiceExam +
        " · " + answered + "/50 answered" + left +
        '</div><button type="button" class="btn primary" data-act="prac-submit">Submit</button>' +
        '<button type="button" class="btn" data-act="prac-reset">Reset</button></div></div>';
    }
    return "";
  }

  function render() {
    ensureTicker();
    document.querySelector("header.app-head").innerHTML = headerHtml();
    let html = "";
    if (tab === "quiz") {
      if (screen === "home") html = quizHomeHtml();
      else if (screen === "quiz") html = quizCardHtml();
      else html = quizSummaryHtml();
    } else {
      html = practiceHtml();
    }
    document.getElementById("app").innerHTML = html;
    const dock = document.getElementById("dock");
    dock.innerHTML = dockHtml();
    window.scrollTo(0, 0);
  }

  function onClick(e) {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    const val = btn.getAttribute("data-val");
    if (btn.tagName === "SELECT" || (btn.tagName === "INPUT" && btn.type === "checkbox")) return;
    if (act === "tab-quiz") { tab = "quiz"; render(); return; }
    if (act === "tab-practice") { tab = "practice"; render(); return; }
    if (act === "set-kind") { kind = val; render(); return; }
    if (act === "set-exam") { exam = val; render(); return; }
    if (act === "set-random") { randomSize = Number(val); render(); return; }
    if (act === "start-quiz") { startQuiz(); return; }
    if (act === "hint") { hinted = true; render(); return; }
    if (act === "reveal") { revealed = true; render(); return; }
    if (act === "mark") { applyMark(val); return; }
    if (act === "end-quiz") { finishQuiz(); return; }
    if (act === "quiz-home") { goQuizHome(); return; }
    if (act === "quiz-missed") { startMissed(); return; }
    if (act === "set-prac-exam") {
      practiceExam = val;
      practiceIndex = 0;
      const prac = saved.practice[practiceExam];
      if (practiceTimerOn && !prac.submitted && !prac.startedAt) {
        prac.startedAt = Date.now();
        persist();
      }
      render();
      return;
    }
    if (act === "set-filter") { practiceFilter = val; practiceIndex = 0; render(); return; }
    if (act === "prac-pick") {
      const prac = saved.practice[practiceExam];
      if (prac.submitted) return;
      prac.answers[practiceIndex] = Number(val);
      if (practiceTimerOn && !prac.startedAt) prac.startedAt = Date.now();
      persist();
      render();
      return;
    }
    if (act === "prac-prev") {
      if (saved.practice[practiceExam].submitted) {
        practiceIndex = Math.max(0, practiceIndex - 1);
      } else {
        practiceIndex = Math.max(0, practiceIndex - 1);
      }
      render();
      return;
    }
    if (act === "prac-next") {
      if (saved.practice[practiceExam].submitted) {
        practiceIndex += 1;
      } else {
        practiceIndex = Math.min(49, practiceIndex + 1);
      }
      render();
      return;
    }
    if (act === "prac-submit") { submitPractice(); return; }
    if (act === "prac-reset") { resetPractice(); return; }
  }

  function onChange(e) {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "toggle-shuffle") { shuffleOn = el.checked; return; }
    if (act === "toggle-timer") { timerOn = el.checked; return; }
    if (act === "set-section") { section = el.value; render(); return; }
    if (act === "toggle-prac-timer") {
      practiceTimerOn = el.checked;
      now = Date.now();
      const prac = saved.practice[practiceExam];
      if (practiceTimerOn && !prac.submitted && !prac.startedAt) {
        prac.startedAt = Date.now();
        persist();
      }
      render();
    }
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  render();
})();

  </script>
</body>
</html>
