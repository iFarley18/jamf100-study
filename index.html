      const close = Array.isArray(p.close) ? p.close.filter(function (x) { return typeof x === "string"; }) : [];
      const bestStreak = typeof p.bestStreak === "number" && p.bestStreak > 0 ? p.bestStreak : 0;
      const practice = emptyPractice();
      if (p.practice && typeof p.practice === "object") {
        EXAM_IDS.forEach(function (ex) {
          const src = p.practice[ex] || {};
          const answers = {};
          if (src.answers && typeof src.answers === "object") {
            Object.keys(src.answers).forEach(function (k) {
              const n = Number(src.answers[k]);
              if (Number.isInteger(n)) answers[k] = n;
            });
          }
          practice[ex] = {
            answers: answers,
            submitted: !!src.submitted,
            startedAt: typeof src.startedAt === "number" ? src.startedAt : 0
          };
        });
      }
      return { missed: missed, close: close, bestStreak: bestStreak, practice: practice };
    } catch (e) {
      return base;
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify(saved));
    } catch (e) { /* ignore quota or private mode */ }
  }

  let saved = loadSaved();
  let tab = "quiz";
  let screen = "home";
  let kind = "exam";
  let exam = "A";
  let section = "DF";
  let randomSize = 10;
  let shuffleOn = true;
  let timerOn = false;
  let deck = [];
  let index = 0;
  let hinted = false;
  let revealed = false;
  let marks = {};
  let streak = 0;
  let bestInSession = 0;
  let startedAt = 0;
  let timedRound = false;
  let practiceExam = "A";
  let practiceTimerOn = false;
  let practiceIndex = 0;
  let practiceFilter = "missed";
  let now = Date.now();
  let ticker = null;

  function pileCount() {
    return saved.missed.length + saved.close.length;
  }

  function examCount(ex) {
    return CARDS.filter(function (c) { return c.exam === ex; }).length;
  }

  function topicCount(t) {
    return CARDS.filter(function (c) { return c.topic === t; }).length;
  }

  function previewCount() {
    if (kind === "exam") return examCount(exam);
    if (kind === "section") return topicCount(section);
    if (kind === "random") return Math.min(randomSize, CARDS.length);
    return pileCount();
  }

  function remainingFor(start) {
    if (!start) return LIMIT;
    return Math.max(0, LIMIT - Math.floor((now - start) / 1000));
  }

  function ensureTicker() {
    const quizTicking = tab === "quiz" && screen === "quiz" && timedRound && startedAt;
    const prac = saved.practice[practiceExam];
    const pracTicking = tab === "practice" && practiceTimerOn && prac && prac.startedAt && !prac.submitted;
    if (quizTicking || pracTicking) {
      if (!ticker) ticker = setInterval(onTick, 1000);
    } else if (ticker) {
      clearInterval(ticker);
      ticker = null;
    }
  }

  function onTick() {
    now = Date.now();
    const el = document.getElementById("timer-display");
    if (tab === "quiz" && timedRound && startedAt) {
      const left = remainingFor(startedAt);
      if (el) el.textContent = mmss(left) + " left";
      if (left === 0) {
        if (Object.keys(marks).length === 0) goQuizHome();
        else finishQuiz();
        return;
      }
    }
    if (tab === "practice") {
      const prac = saved.practice[practiceExam];
      if (practiceTimerOn && prac.startedAt && !prac.submitted) {
        const left = remainingFor(prac.startedAt);
        if (el) el.textContent = mmss(left) + " left";
        if (left === 0) {
          prac.submitted = true;
          persist();
          render();
          return;
        }
      }
    }
  }

  function startQuiz() {
    let list = [];
    if (kind === "exam") list = CARDS.filter(function (c) { return c.exam === exam; });
    else if (kind === "section") list = CARDS.filter(function (c) { return c.topic === section; });
    else if (kind === "random") list = shuffle(CARDS).slice(0, randomSize);
    else {
      const want = {};
      saved.missed.forEach(function (id) { want[id] = true; });
      saved.close.forEach(function (id) { want[id] = true; });
      list = CARDS.filter(function (c) { return want[c.id]; });
    }
    if (kind !== "random" && shuffleOn) list = shuffle(list);
    if (!list.length) return;
    const useTimer = timerOn && list.length === 50;
    deck = list;
    index = 0;
    marks = {};
    streak = 0;
    bestInSession = 0;
    hinted = false;
    revealed = false;
    timedRound = useTimer;
    now = Date.now();
    startedAt = useTimer ? now : 0;
    screen = "quiz";
    render();
  }

  function goQuizHome() {
    screen = "home";
    deck = [];
    index = 0;
    hinted = false;
    revealed = false;
    timedRound = false;
    startedAt = 0;
    render();
  }

  function finishQuiz() {
    if (Object.keys(marks).length === 0) {
      goQuizHome();
      return;
    }
    screen = "summary";
    render();
  }

  function applyMark(m) {
    const current = deck[index];
    if (!current) return;
    const id = current.id;
    marks[id] = m;
    const nextStreak = m === "got" ? streak + 1 : 0;
    streak = nextStreak;
    if (nextStreak > bestInSession) bestInSession = nextStreak;
    saved.missed = saved.missed.filter(function (x) { return x !== id; });
    saved.close = saved.close.filter(function (x) { return x !== id; });
    if (m === "missed") saved.missed.push(id);
    if (m === "close") saved.close.push(id);
    if (nextStreak > saved.bestStreak) saved.bestStreak = nextStreak;
    persist();
    if (index + 1 >= deck.length) {
      screen = "summary";
    } else {
      index += 1;
      hinted = false;
      revealed = false;
    }
    render();
  }

  function startMissed() {
    kind = "missed";
    const want = {};
    saved.missed.forEach(function (id) { want[id] = true; });
    saved.close.forEach(function (id) { want[id] = true; });
    let list = CARDS.filter(function (c) { return want[c.id]; });
    if (shuffleOn) list = shuffle(list);
    if (!list.length) return;
    deck = list;
    index = 0;
    marks = {};
    streak = 0;
    bestInSession = 0;
    hinted = false;
    revealed = false;
    timedRound = false;
    startedAt = 0;
    screen = "quiz";
    render();
  }

  function practiceItems() {
    return CARDS.filter(function (c) { return c.exam === practiceExam; });
  }

  function practiceScore(items, answers) {
    let n = 0;
    items.forEach(function (it, i) {
      if (answers[i] === it.ans) n += 1;
    });
    return n;
  }

  function resetPractice() {
    saved.practice[practiceExam] = { answers: {}, submitted: false, startedAt: practiceTimerOn ? Date.now() : 0 };
    practiceIndex = 0;
    persist();
    render();
  }

  function submitPractice() {
    const prac = saved.practice[practiceExam];
    prac.submitted = true;
    practiceIndex = 0;
    persist();
    render();
  }

  function countsFromMarks() {
    const ids = Object.keys(marks);
    return {
      got: ids.filter(function (id) { return marks[id] === "got"; }).length,
      close: ids.filter(function (id) { return marks[id] === "close"; }).length,
      missed: ids.filter(function (id) { return marks[id] === "missed"; }).length,
      answered: ids.length
    };
  }

  function topicSummary() {
    const rows = [];
    TOPIC_KEYS.forEach(function (k) {
      const cards = deck.filter(function (c) { return c.topic === k && marks[c.id]; });
      if (!cards.length) return;
      const got = cards.filter(function (c) { return marks[c.id] === "got"; }).length;
      const close = cards.filter(function (c) { return marks[c.id] === "close"; }).length;
      const missed = cards.filter(function (c) { return marks[c.id] === "missed"; }).length;
      rows.push({ k: k, total: cards.length, got: got, close: close, missed: missed, weak: missed + close });
    });
    rows.sort(function (a, b) { return b.weak - a.weak || a.got / a.total - b.got / b.total; });
    return rows;
  }

  function practiceTopicRows(items, answers) {
    const rows = [];
    TOPIC_KEYS.forEach(function (k) {
      const subset = items.filter(function (it) { return it.topic === k; });
      if (!subset.length) return;
      let right = 0;
      subset.forEach(function (it) {
        const i = items.indexOf(it);
        if (answers[i] === it.ans) right += 1;
      });
      rows.push({ k: k, total: subset.length, right: right, missed: subset.length - right });
    });
    rows.sort(function (a, b) { return b.missed - a.missed || a.right / a.total - b.right / b.total; });
    return rows;
  }

  function choiceLetter(it, oi) {
    return it.opts.length === 2 ? (oi === 0 ? "T" : "F") : LETTERS[oi];
  }

  function quizCardHtml() {
    const current = deck[index];
    const c = countsFromMarks();

      const cls = revealed && isAns ? " choice correct" : "choice";

    }).join("");

      "<h2>Quiz Brian</h2>" +

      const it = items[practiceIndex];
      body += '<div class="card">';
      body += "<h2>Exam " + practiceExam + "</h2>";
      body += '<div class="meta">Question ' + (practiceIndex + 1) + " of 50 · " + escapeHtml(TOPICS[it.topic]) +
        (it.opts.length === 2 ? " · True or false" : "") + "</div>";
      body += '<div class="bar"><span style="width:' + ((practiceIndex / 50) * 100) + '%"></span></div>';
      body += '<div class="question">' + rich(it.q) + "</div>";
      body += '<div class="choices">' + it.opts.map(function (o, oi) {

        return '<button type="button" class="choice" aria-pressed="' + sel + '" data-act="prac-pick" data-val="' + oi + '"><span class="ltr">' +
          choiceLetter(it, oi) + "</span><span>" + rich(o) + "</span></button>";
      }).join("") + "</div>";
      body += '<div class="row">' +
        '<button type="button" class="btn" data-act="prac-prev"' + (practiceIndex <= 0 ? " disabled" : "") + ">Previous</button>" +
        '<button type="button" class="btn primary" data-act="prac-next"' + (practiceIndex >= 49 ? " disabled" : "") + ">Next</button>" +
        "</div>";
      body += "<p>" + answered + " of 50 answered. You can move around and change answers until you submit.</p>";
      body += "</div>";
    }

    return (
      "<h2>Practice exams</h2>" +
      "<p>Four original 50-question practice exams, scored against the real 80% pass mark, with an optional 60-minute timer. These are not questions from the real exam.</p>" +
      "<h3>Choose an exam</h3>" +
      segHtml("pexam", [
        { value: "A", label: "Exam A" },
        { value: "B", label: "Exam B" },
        { value: "C", label: "Exam C" },
        { value: "D", label: "Exam D" }
      ], practiceExam, "set-prac-exam") +
      (!done ? '<label class="toggle"><input type="checkbox" data-act="toggle-prac-timer"' + (practiceTimerOn ? " checked" : "") + "> 60-minute timer (submits automatically at 0:00)</label>" : "") +
      "<details><summary>About the real exam</summary>" +
        "<dl>" +
          "<dt>Questions</dt><dd>50, multiple choice and true or false, one correct answer each</dd>" +
          "<dt>Time limit</dt><dd>60 minutes, cannot be paused (90 minutes on the extended-time version)</dd>" +
          "<dt>Passing score</dt><dd>80%, or 40 of 50</dd>" +
          "<dt>Format</dt><dd>Online, open-note, open-book and open-internet</dd>" +
          "<dt>Last revised</dt><dd>Exam revised October 1, 2026</dd>" +
        "</dl>" +
        "<p>Jamf does not publish how many questions come from each section, so the topic mix here is an estimate. Blueprint and compliance benchmark lessons were added to the course on November 6, 2026, after the exam’s last revision, so they may not be on the exam yet.</p>" +
      "</details>" +
      body
    );
  }

  function dockHtml() {
    if (tab === "quiz" && screen === "quiz") {
      const c = countsFromMarks();
      const left = timedRound ? " · <span id=\"timer-display\">" + mmss(remainingFor(startedAt)) + " left</span>" : "";
      return '<div class="dock"><div class="dock-inner"><div class="status">' +
        (index + 1) + "/" + deck.length + " · Got it " + c.got + " · Streak " + streak + left +
        '</div><button type="button" class="btn" data-act="end-quiz">End session</button></div></div>';
    }
    if (tab === "practice") {
      const prac = saved.practice[practiceExam];
      if (prac.submitted) return "";
      const answered = Object.keys(prac.answers).length;
      const showTimer = practiceTimerOn && (prac.startedAt || true);
      const left = (practiceTimerOn && prac.startedAt)
        ? " · <span id=\"timer-display\">" + mmss(remainingFor(prac.startedAt)) + " left</span>"
        : (practiceTimerOn ? " · <span id=\"timer-display\">60:00 left</span>" : "");
      return '<div class="dock"><div class="dock-inner"><div class="status">Exam ' + practiceExam +
        " · " + answered + "/50 answered" + left +
        '</div><button type="button" class="btn primary" data-act="prac-submit">Submit</button>' +
        '<button type="button" class="btn" data-act="prac-reset">Reset</button></div></div>';
    }
    return "";
  }


  function practiceInProgress() {
    if (tab !== "practice") return false;
    const prac = saved.practice[practiceExam];
    return prac && !prac.submitted;
  }

  function fold(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9+/.<>-]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function tokens(s) {
    return fold(s).split(" ").filter(function (t) { return t.length; });
  }

  function typoClose(word, needle) {
    if (needle.length < 4 || Math.abs(word.length - needle.length) > 1) return false;
    let i = 0, j = 0, miss = 0;
    while (i < word.length && j < needle.length) {
      if (word[i] === needle[j]) { i += 1; j += 1; continue; }
      miss += 1;
      if (miss > 1) return false;
      if (word.length > needle.length) i += 1;
      else if (needle.length > word.length) j += 1;
      else { i += 1; j += 1; }
    }
    miss += (word.length - i) + (needle.length - j);
    return miss <= 1;
  }

  function tokenScore(hay, tok) {
    if (!tok) return 0;
    if (hay.indexOf(" " + tok + " ") !== -1 || hay === tok || hay.indexOf(tok + " ") === 0 || hay.lastIndexOf(" " + tok) === hay.length - tok.length - 1) return 8;
    if ((" " + hay).indexOf(" " + tok) !== -1) return 5;
    if (hay.indexOf(tok) !== -1) return 3;
    const words = hay.split(" ");
    for (let i = 0; i < words.length; i++) {
      if (typoClose(words[i], tok)) return 2;
    }
    return 0;
  }

  function highlight(text, query) {
    const raw = String(text || "");
    const toks = tokens(query).filter(function (t) { return t.length > 1; }).sort(function (a, b) { return b.length - a.length; });
    if (!toks.length) return escapeHtml(raw);
    const re = new RegExp("(" + toks.map(function (t) {
      return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("|") + ")", "ig");
    return escapeHtml(raw).replace(re, "<mark>$1</mark>");
  }

  function snippetAround(text, query, width) {
    const raw = String(text || "").replace(/\s+/g, " ").trim();
    const q = fold(query);
    if (!q) return raw.slice(0, width);
    const low = fold(raw);
    let at = low.indexOf(q);
    if (at < 0) {
      const first = tokens(query)[0] || "";
      at = first ? low.indexOf(first) : 0;
    }
    if (at < 0) at = 0;
    // Map folded index roughly onto raw by walking whitespace-normalized length
    let start = Math.max(0, at - Math.floor(width / 4));
    let end = Math.min(raw.length, start + width);
    if (end - start < width) start = Math.max(0, end - width);
    let cut = raw.slice(start, end);
    if (start > 0) cut = "…" + cut;
    if (end < raw.length) cut += "…";
    return cut;
  }

  function hideStudyNotes() {
    return practiceInProgress();
  }

  function searchIndex() {
    const items = [];
    QUICKREF.forEach(function (r) {
      items.push({
        kind: "ref",
        id: r.id,
        title: r.title,
        cat: r.cat,
        path: r.path,
        body: r.fact,
        hay: fold([r.title, r.cat, r.path, r.fact, r.aliases, r.sourceTitle].join(" ")),
        source: r.source,
        sourceTitle: r.sourceTitle
      });
    });
    if (!hideStudyNotes()) {
      CARDS.forEach(function (c) {
        items.push({
          kind: "note",
          id: c.id,
          title: c.q,
          cat: (TOPICS[c.topic] || c.topic) + " · Exam " + c.exam,
          path: "",
          body: (c.why || "") + (c.hint ? " Hint: " + c.hint : ""),
          hay: fold([c.q, c.why, c.hint, TOPICS[c.topic] || "", c.topic, c.exam].join(" ")),
          source: "",
          sourceTitle: ""
        });
      });
    }
    return items;
  }

  function runSearch(query) {
    const q = fold(query);
    if (!q) return [];
    const toks = tokens(query);
    const phrase = q;
    const scored = [];
    searchIndex().forEach(function (it) {
      let score = 0;
      const title = fold(it.title);
      if (title === phrase) score += 80;
      else if (title.indexOf(phrase) === 0) score += 50;
      else if (title.indexOf(phrase) !== -1) score += 30;
      if (it.hay.indexOf(phrase) !== -1) score += 20;
      let hits = 0;
      for (let i = 0; i < toks.length; i++) {
        const ts = tokenScore(it.hay, toks[i]) + tokenScore(title, toks[i]) * 2;
        if (ts) { hits += 1; score += ts; }
      }
      if (hits === 0) return;
      if (hits === toks.length) score += 10;
      if (it.kind === "ref") score += 4;
      scored.push({ it: it, score: score });
    });
    scored.sort(function (a, b) { return b.score - a.score || a.it.title.localeCompare(b.it.title); });
    return scored.slice(0, 25);
  }

  function resultItemHtml(row, i, active) {
    const it = row.it;
    const kicker = it.kind === "ref" ? "Lookup · " + it.cat : "Study note · " + it.cat;
    const snip = snippetAround(it.path ? it.path + " — " + it.body : it.body, searchQ, 140);
    return '<button type="button" role="option" class="search-item' + (active ? " active" : "") +
      '" data-act="open-result" data-kind="' + it.kind + '" data-id="' + escapeHtml(it.id) +
      '" id="sr-' + i + '"><div class="kicker">' + escapeHtml(kicker) + "</div><div class=\"ttl\">" +
      highlight(it.title, searchQ) + '</div><p class="snip">' + highlight(snip, searchQ) + "</p></button>";
  }

  function paintResults() {
    const box = document.getElementById("lookup-results");
    const input = document.getElementById("lookup-q");
    if (!box) return;
    const q = (input ? input.value : searchQ);
    searchQ = q;
    const rows = q.trim() ? runSearch(q) : [];
    if (!searchOpen || !q.trim()) {
      box.classList.remove("open");
      box.innerHTML = "";
      return;
    }
    if (searchSel >= rows.length) searchSel = rows.length - 1;
    let msg = "";
    if (!rows.length) {
      msg = '<div class="search-status">No matches for “' + escapeHtml(q.trim()) + '”.</div>';
    } else {
      const hidden = hideStudyNotes()
        ? " Practice-exam answers are hidden until you submit, so you are not spoiled."
        : "";
      msg = '<div class="search-status">' + rows.length + " result" + (rows.length === 1 ? "" : "s") +
        " in official lookup" + (hideStudyNotes() ? "" : " and study notes") + "." + hidden + "</div>";
    }
    box.innerHTML = msg + rows.map(function (row, i) { return resultItemHtml(row, i, i === searchSel); }).join("");
    box.classList.add("open");
  }

  function openResult(kind, id) {
    searchOpen = false;
    if (kind === "ref") {
      tab = "lookup";
      lookupFocus = id;
      const rec = QUICKREF.filter(function (r) { return r.id === id; })[0];
      if (rec) lookupCat = rec.cat;
      render();
      const el = document.getElementById("ref-" + id);
      if (el) el.scrollIntoView({ block: "start" });
      return;
    }
    tab = "lookup";
    lookupFocus = "note-" + id;
    lookupCat = "Study notes";
    render();
    const el = document.getElementById("note-" + id);
    if (el) el.scrollIntoView({ block: "start" });
  }

  function lookupHtml() {
    const cats = [];
    const seen = {};
    QUICKREF.forEach(function (r) {
      if (!seen[r.cat]) { seen[r.cat] = true; cats.push(r.cat); }
    });
    const catOpts = [{ value: "all", label: "All facts", count: QUICKREF.length }]
      .concat(cats.map(function (c) {
        return { value: c, label: c, count: QUICKREF.filter(function (r) { return r.cat === c; }).length };
      }))
      .concat(hideStudyNotes() ? [] : [{ value: "Study notes", label: "Study notes", count: CARDS.length }]);
    if (lookupCat !== "all" && lookupCat !== "Study notes" && cats.indexOf(lookupCat) < 0) lookupCat = "all";

    let body = "";
    if (lookupCat === "Study notes") {
      if (hideStudyNotes()) {
        body = '<div class="note">Study notes from the practice questions are hidden while a practice exam is in progress, so you do not accidentally see an answer. Official lookup facts stay available. Submit or reset the exam to search your notes again.</div>';
      } else {
        const q = fold(searchQ);
        const notes = CARDS.filter(function (c) {
          if (!q) return true;
          return fold([c.q, c.why, c.hint, TOPICS[c.topic] || ""].join(" ")).indexOf(q) !== -1 || runSearch(searchQ).some(function (row) { return row.it.kind === "note" && row.it.id === c.id; });
        });
        body = notes.map(function (c) {
          const focus = lookupFocus === "note-" + c.id ? " style=\"outline: 2px solid var(--accent); outline-offset: 2px;\"" : "";
          return '<article class="ref-card note-card" id="note-' + escapeHtml(c.id) + '"' + focus + ">" +
            '<div class="kicker">Study note · ' + escapeHtml(TOPICS[c.topic] || c.topic) + " · Exam " + escapeHtml(c.exam) + "</div>" +
            "<h3>" + highlight(c.q, searchQ) + "</h3>" +
            '<p class="why">' + highlight(c.why, searchQ) + "</p>" +
            (c.hint ? '<p class="path-line">Hint: ' + highlight(c.hint, searchQ) + "</p>" : "") +
            "</article>";
        }).join("") || "<p>No study notes match.</p>";
      }
    } else {
      const q = searchQ.trim();
      const rows = q ? runSearch(q).filter(function (row) { return row.it.kind === "ref"; }).map(function (row) { return row.it; }) : QUICKREF.slice();
      const list = rows.filter(function (r) { return lookupCat === "all" || r.cat === lookupCat || r.id === (rows.filter && 0); })
        .filter(function (r) { return lookupCat === "all" || r.cat === lookupCat; });
      body = (q && lookupCat !== "all" && !list.length ? "<p>No lookup facts in this topic match that search. Try All facts.</p>" : "") +
        list.map(function (r) {
          const focus = lookupFocus === r.id ? " style=\"outline: 2px solid var(--accent); outline-offset: 2px;\"" : "";
          return '<article class="ref-card" id="ref-' + escapeHtml(r.id) + '"' + focus + ">" +
            '<div class="kicker">' + escapeHtml(r.cat) + "</div>" +
            "<h3>" + highlight(r.title, q) + "</h3>" +
            (r.path ? '<p class="path-line">In Jamf Pro: <code>' + highlight(r.path, q) + "</code></p>" : "") +
            '<p class="fact">' + highlight(r.fact || r.body, q) + "</p>" +
            '<a class="src-link" href="' + escapeHtml(r.source) + '" target="_blank" rel="noopener noreferrer">Official source: ' +
            escapeHtml(r.sourceTitle) + " ↗</a></article>";
        }).join("");
    }

    return (
      "<h2>Lookup</h2>" +
      "<p>Search this page or browse official Jamf Pro facts. Every lookup fact comes from current Jamf Pro documentation and links to its source. The Jamf Certified Associate exam is open-note, open-book, and open-internet, so you can use this during the test or while you study. Press <kbd>/</kbd> from anywhere to jump to the search box.</p>" +
      '<div class="note">These are concise study notes, not a substitute for the full docs. If a setting name has changed in your Jamf Pro version, follow the official page.</div>' +
      (hideStudyNotes() ? '<div class="note">A practice exam is in progress, so answers from those questions are hidden here. Official lookup facts stay available.</div>' : "") +
      '<div class="lookup-toolbar">' + segHtml("lookup-cat", catOpts, lookupCat, "set-lookup-cat") + "</div>" +
      body
    );
  }

  function bindSearch() {
    const input = document.getElementById("lookup-q");
    if (!input) return;
    input.addEventListener("input", function () {
      searchQ = input.value;
      searchOpen = true;
      searchSel = -1;
      paintResults();
    });
    input.addEventListener("focus", function () {
      searchQ = input.value;
      if (searchQ.trim()) { searchOpen = true; paintResults(); }
    });
    input.addEventListener("keydown", function (e) {
      const rows = searchQ.trim() ? runSearch(searchQ) : [];
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!rows.length) return;
        searchOpen = true;
        searchSel = Math.min(rows.length - 1, searchSel + 1);
        paintResults();
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        searchSel = Math.max(-1, searchSel - 1);
        paintResults();
        return;
      }
      if (e.key === "Enter") {
        if (!rows.length) return;
        e.preventDefault();
        const pick = rows[searchSel >= 0 ? searchSel : 0];
        openResult(pick.it.kind, pick.it.id);
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        if (searchOpen) { searchOpen = false; paintResults(); return; }
        if (searchQ) { searchQ = ""; input.value = ""; searchOpen = false; paintResults(); return; }
        input.blur();
      }
    });
    if (searchOpen && searchQ.trim()) paintResults();
    if (document.activeElement && document.activeElement.id === "lookup-q") {
      // keep cursor at end after a full render that restored the value
      const v = input.value;
      input.focus();
      try { input.setSelectionRange(v.length, v.length); } catch (err) {}
    }
  }

  function render() {
    ensureTicker();
    const keepSearchFocus = document.activeElement && document.activeElement.id === "lookup-q";
    document.querySelector("header.app-head").innerHTML = headerHtml();
    let html = "";
    if (tab === "quiz") {
      if (screen === "home") html = quizHomeHtml();
      else if (screen === "quiz") html = quizCardHtml();
      else html = quizSummaryHtml();
    } else if (tab === "lookup") {
      html = lookupHtml();
    } else {
      html = practiceHtml();
    }
    document.getElementById("app").innerHTML = html;
    const dock = document.getElementById("dock");
    dock.innerHTML = dockHtml();
    bindSearch();
    if (!keepSearchFocus && !lookupFocus) window.scrollTo(0, 0);
    lookupFocus = lookupFocus || "";
  }

  function onClick(e) {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    const val = btn.getAttribute("data-val");
    if (btn.tagName === "SELECT" || (btn.tagName === "INPUT" && btn.type === "checkbox")) return;
    if (act === "tab-quiz") { tab = "quiz"; searchOpen = false; render(); return; }
    if (act === "tab-practice") { tab = "practice"; searchOpen = false; render(); return; }
    if (act === "tab-lookup") { tab = "lookup"; searchOpen = false; render(); return; }
    if (act === "set-lookup-cat") { lookupCat = val; lookupFocus = ""; render(); return; }
    if (act === "search-clear") {
      searchQ = "";
      searchOpen = false;
      searchSel = -1;
      render();
      const input = document.getElementById("lookup-q");
      if (input) input.focus();
      return;
    }
    if (act === "open-result") {
      openResult(btn.getAttribute("data-kind"), btn.getAttribute("data-id"));
      return;
    }
    if (act === "set-kind") { kind = val; render(); return; }
    if (act === "set-exam") { exam = val; render(); return; }
    if (act === "set-random") { randomSize = Number(val); render(); return; }
    if (act === "start-quiz") { startQuiz(); return; }
    if (act === "hint") { hinted = true; render(); return; }
    if (act === "reveal") { revealed = true; render(); return; }
    if (act === "mark") { applyMark(val); return; }
    if (act === "end-quiz") { finishQuiz(); return; }
    if (act === "quiz-home") { goQuizHome(); return; }
    if (act === "quiz-missed") { startMissed(); return; }
    if (act === "set-prac-exam") {
      practiceExam = val;
      practiceIndex = 0;
      const prac = saved.practice[practiceExam];
      if (practiceTimerOn && !prac.submitted && !prac.startedAt) {
        prac.startedAt = Date.now();
        persist();
      }
      render();
      return;
    }
    if (act === "set-filter") { practiceFilter = val; practiceIndex = 0; render(); return; }
    if (act === "prac-pick") {
      const prac = saved.practice[practiceExam];
      if (prac.submitted) return;
      prac.answers[practiceIndex] = Number(val);
      if (practiceTimerOn && !prac.startedAt) prac.startedAt = Date.now();
      persist();
      render();
      return;
    }
    if (act === "prac-prev") {
      if (saved.practice[practiceExam].submitted) {
        practiceIndex = Math.max(0, practiceIndex - 1);
      } else {
        practiceIndex = Math.max(0, practiceIndex - 1);
      }
      render();
      return;
    }
    if (act === "prac-next") {
      if (saved.practice[practiceExam].submitted) {
        practiceIndex += 1;
      } else {
        practiceIndex = Math.min(49, practiceIndex + 1);
      }
      render();
      return;
    }
    if (act === "prac-submit") { submitPractice(); return; }
    if (act === "prac-reset") { resetPractice(); return; }
  }

  function onChange(e) {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "toggle-shuffle") { shuffleOn = el.checked; return; }
    if (act === "toggle-timer") { timerOn = el.checked; return; }
    if (act === "set-section") { section = el.value; render(); return; }
    if (act === "toggle-prac-timer") {
      practiceTimerOn = el.checked;
      now = Date.now();
      const prac = saved.practice[practiceExam];
      if (practiceTimerOn && !prac.submitted && !prac.startedAt) {
        prac.startedAt = Date.now();
        persist();
      }
      render();
    }
  }

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const t = e.target;
      const tag = (t && t.tagName) ? t.tagName.toLowerCase() : "";
      const typing = tag === "input" || tag === "textarea" || tag === "select" || (t && t.isContentEditable);
      if (typing) return;
      e.preventDefault();
      const input = document.getElementById("lookup-q");
      if (input) {
        input.focus();
        input.select();
        if (input.value.trim()) { searchOpen = true; paintResults(); }
      }
      return;
    }
    if (e.key === "Escape" && searchOpen) {
      searchOpen = false;
      paintResults();
    }
  });
  document.addEventListener("click", function (e) {
    if (e.target.closest(".search-wrap")) return;
    if (searchOpen) { searchOpen = false; paintResults(); }
  });
  if (location.protocol === "https:" && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  render();
})();

  </script>
</body>
