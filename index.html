ffline","Ongoing","Flush logs"],"ans":0,"why":"Featured items are shown prominently on the home page.","hint":"This Self Service option puts the item in a prominent spot on the home page."},{"id":"C47","exam":"C","topic":"SCR","q":"When a policy has both a package and a script, what does the script's Priority setting control?","opts":["Whether the script runs Before or After other actions such as package installs","How many times it retries","Its category","Which users see it"],"ans":0,"why":"Before runs the script first; After runs it once the other payloads finish.","hint":"Priority here means timing: the script can run before the other policy actions, or after they finish."},{"id":"C48","exam":"C","topic":"SCR","q":"Which command makes a Mac check for policies it should run right now?","opts":["`sudo jamf policy`","`sudo jamf recon`","`jamf help`","`sudo shutdown -r now`"],"ans":0,"why":"`jamf policy` checks in and runs any eligible check-in policies.","hint":"One jamf command asks 'are there policies I should run?' The inventory command is a different one."},{"id":"C49","exam":"C","topic":"SCR","q":"What does Jamf Pro pass to a script as parameter $3?","opts":["The username of the logged-in user","The serial number","The Jamf Pro URL","The policy name"],"ans":0,"why":"Parameter 1 is the mount point, 2 the computer name, and 3 the username.","hint":"Jamf Pro fills the first three slots for you. The third one is the person currently logged in to the Mac."}],"D":[{"id":"D0","exam":"D","topic":"DF","q":"A standard (non-admin) macOS user can install software that needs administrator approval without entering admin credentials.","opts":["True","False"],"ans":1,"why":"Standard users must supply an administrator's name and password for changes that need admin rights.","hint":"Think about whether a standard account can approve a system-wide install on its own, or whether an administrator's name and password are still required."},{"id":"D1","exam":"D","topic":"DF","q":"Which file extension is used for a macOS disk image, a common way to distribute downloaded apps?","opts":[".dmg",".ipa",".mobileconfig",".sh"],"ans":0,"why":".dmg is a disk image; .ipa is an iOS app archive.","hint":"Downloaded Mac apps often arrive as a disk image. That extension is not the one used for iPhone app archives or for profiles."},{"id":"D2","exam":"D","topic":"DF","q":"Where are apps usually installed on a Mac so every user can use them?","opts":["~/Downloads","/Applications","/System/Library","~/Documents"],"ans":1,"why":"/Applications is shared by all users of the Mac.","hint":"The folder that every user of the Mac shares for apps sits at the top of the disk, not inside one person's home folder."},{"id":"D3","exam":"D","topic":"DF","q":"Which built-in macOS app gives you a command-line interface?","opts":["Console","Terminal","Script Editor","Automator"],"ans":1,"why":"Terminal opens a shell such as zsh.","hint":"It's the app whose window is a command-line shell, often zsh — not Console or Script Editor."},{"id":"D4","exam":"D","topic":"DF","q":"Apps installed from the Mac App Store are placed in the /Applications folder.","opts":["True","False"],"ans":0,"why":"App Store apps install to /Applications.","hint":"Think about where Mac App Store software lands on the disk — the same shared apps folder everyone uses."},{"id":"D5","exam":"D","topic":"DF","q":"Which Terminal command prints the short name of the user running the shell?","opts":["`pwd`","`whoami`","`ls`","`cd`"],"ans":1,"why":"`whoami` prints the username; `pwd` prints the current folder.","hint":"The command's name is a short question: who am I? A different command prints the current folder."},{"id":"D6","exam":"D","topic":"DF","q":"Which built-in macOS app moves accounts, apps and files from an old Mac or Time Machine backup to a new Mac?","opts":["Migration Assistant","Boot Camp Assistant","Disk Utility","Finder"],"ans":0,"why":"Migration Assistant transfers data during or after setup.","hint":"The app's name is about moving to a new Mac — accounts, apps, and files from an old Mac or a Time Machine backup."},{"id":"D7","exam":"D","topic":"APL","q":"Where are MDM push certificates created and renewed?","opts":["Apple Push Certificates Portal","App Store Connect","Jamf Nation","Apple Configurator"],"ans":0,"why":"Push certificates are issued at the Apple Push Certificates Portal (identity.apple.com) using a CSR from Jamf Pro.","hint":"These certificates are issued on Apple's own push-certificate website, using a request file that Jamf Pro creates — not in App Store Connect or Jamf Nation."},{"id":"D8","exam":"D","topic":"APL","q":"Which file do you download from Apple Business or Apple School Manager to connect an Apps and Books location to Jamf Pro?","opts":["A content token (.vpptoken)","A server token (.p7m)","A push certificate (.pem)","A configuration profile (.mobileconfig)"],"ans":0,"why":"The content token links a purchasing location; the .p7m server token is for ADE.","hint":"There are two different tokens. The one for Apps and Books is the content token. The other (.p7m) is for Automated Device Enrollment."},{"id":"D9","exam":"D","topic":"APL","q":"Which description best fits Declarative Device Management (DDM)?","opts":["Devices apply configurations on their own and proactively report status changes to the server","The server polls each device for every setting","Managing devices without enrolling them","A tool for imaging Macs"],"ans":0,"why":"With DDM the device keeps its own state and reports changes, instead of waiting for commands.","hint":"In this model the device keeps its own state and reports changes, instead of the server having to ask about every setting."},{"id":"D10","exam":"D","topic":"APL","q":"In Apple Business or Apple School Manager, what does federated authentication allow?","opts":["Users sign in to Managed Apple Accounts with credentials from an identity provider such as Microsoft Entra ID or Google Workspace","Devices skip Setup Assistant","Apps install without licenses","Push certificates renew automatically"],"ans":0,"why":"Federation links Managed Apple Accounts to the organization's identity provider.","hint":"This lets people sign in to their Managed Apple Account with the same work or school login they already use, such as Microsoft Entra ID or Google."},{"id":"D11","exam":"D","topic":"APL","q":"Devices enrolled through Automated Device Enrollment can be set so users cannot remove the MDM profile.","opts":["True","False"],"ans":0,"why":"A PreStage can prevent removal of the MDM profile for ADE devices.","hint":"Think about a PreStage setting for Automated Device Enrollment devices: can IT stop the user from removing the management profile?"},{"id":"D12","exam":"D","topic":"APL","q":"In Apple Business, how is a device linked to Jamf Pro for Automated Device Enrollment?","opts":["Its serial number is assigned to the MDM server that represents Jamf Pro","The user installs Jamf Pro from the App Store","IT emails the serial number to Apple","The device is cabled to the Jamf Pro server"],"ans":0,"why":"Device assignment in Apple Business tells the device which MDM server to enroll with.","hint":"In Apple Business, the link is the device's serial number assigned to the MDM server that stands for your Jamf Pro — not an App Store install."},{"id":"D13","exam":"D","topic":"JPI","q":"In Jamf Pro Settings, where do you add Jamf Pro user accounts and groups?","opts":["System > User accounts and groups","Computer management > Policies","Global > Re-enrollment","Self Service > Branding"],"ans":0,"why":"Jamf Pro accounts, groups and their privileges are managed under System settings.","hint":"Look under System settings, where Jamf Pro accounts, groups, and their privileges are managed — not under policies or Self Service."},{"id":"D14","exam":"D","topic":"JPI","q":"What is a Jamf Account used for?","opts":["Signing in to Jamf products and resources such as Jamf training and Jamf Nation","Enrolling iPhones","Creating Managed Apple Accounts","Purchasing apps for devices"],"ans":0,"why":"A Jamf Account is your identity for Jamf services, training and community.","hint":"This is your login for Jamf's own websites and training, not a way to enroll devices or create Apple Accounts."},{"id":"D15","exam":"D","topic":"JPI","q":"A Jamf Pro policy can be assigned to only one category.","opts":["True","False"],"ans":0,"why":"Each object takes a single category used for organizing it.","hint":"Think about how objects are organized in lists and in Self Service: how many of those labels can one policy have?"},{"id":"D16","exam":"D","topic":"JPI","q":"Where do you add installer packages in Jamf Pro so policies can deploy them?","opts":["Settings > Computer management > Packages","Computers > Inventory","Devices > Configuration profiles","Users > Static user groups"],"ans":0,"why":"Packages are uploaded under Computer management and stored on the distribution point.","hint":"Packages are added in Settings, under computer management — then they live on the distribution point so policies can use them."},{"id":"D17","exam":"D","topic":"JPI","q":"Where in Jamf Pro Settings are network segments configured?","opts":["Network > Network segments","Global > Event logs","Self Service > macOS","System > SMTP server"],"ans":0,"why":"Network segments are part of the Network settings.","hint":"The name is a clue: these IP ranges live under the Network settings, not under Self Service or email."},{"id":"D18","exam":"D","topic":"JPI","q":"What does a distribution point hold in Jamf Pro?","opts":["Packages that policies install","Push certificates","Smart group criteria","Device inventory"],"ans":0,"why":"Distribution points such as JCDS host packages; inventory and settings live in the Jamf Pro database.","hint":"This is a file-hosting location for installers that policies can put on Macs. Inventory and settings stay in the Jamf Pro database."},{"id":"D19","exam":"D","topic":"ENR","q":"Which devices can use Automated Device Enrollment?","opts":["Devices in Apple Business or Apple School Manager, bought from Apple or a participating reseller or added with Apple Configurator","Any device with an Apple Account","Only devices bought from a carrier","Any device on company Wi-Fi"],"ans":0,"why":"ADE needs the device's serial number in the organization's Apple Business or Apple School Manager.","hint":"The device's serial number has to be in the organization's Apple Business or Apple School Manager — from Apple, a participating reseller, or added with Apple Configurator."},{"id":"D20","exam":"D","topic":"ENR","q":"Which enrollment method gives a zero-touch experience, enrolling a new device during setup straight out of the box?","opts":["Automated Device Enrollment","User-initiated enrollment","Enrollment invitations","Account-driven User Enrollment"],"ans":0,"why":"ADE enrolls during Setup Assistant with no IT touch.","hint":"The zero-touch method enrolls during the first-run Setup Assistant, out of the box, with no IT visit needed."},{"id":"D21","exam":"D","topic":"ENR","q":"When a device is added to Apple Business with Apple Configurator, how long is the provisional period in which the user can release it?","opts":["24 hours","30 days","90 days","1 year"],"ans":1,"why":"Devices added with Apple Configurator have a 30-day provisional period.","hint":"When a device is added with Apple Configurator, the user has a short window — measured in days, not a year — to release it."},{"id":"D22","exam":"D","topic":"ENR","q":"Why does User Approved MDM matter on macOS?","opts":["Some features, such as PPPC and kernel extension approval, need enrollment approved by a user or done through ADE","It lets users remove the MDM profile","It is required for Spotlight","It speeds up Wi-Fi"],"ans":0,"why":"ADE enrollment, or a user approving the MDM profile, unlocks security-sensitive payloads.","hint":"Some sensitive Mac settings, such as Full Disk Access approvals, only work if enrollment was approved by a user or done through Automated Device Enrollment."},{"id":"D23","exam":"D","topic":"ENR","q":"In a PreStage enrollment, what are the Setup Assistant options for?","opts":["Choosing which setup panes users see or skip","Choosing Dock apps","Setting the push certificate","Setting the inventory schedule"],"ans":0,"why":"PreStages let you skip panes such as Siri or Screen Time to speed up setup.","hint":"These options choose which first-run screens the person sees or skips, such as Siri or Screen Time."},{"id":"D24","exam":"D","topic":"ENR","q":"Which enrollment method requires the user to visit an enrollment URL or follow an invitation, rather than enrolling during Setup Assistant?","opts":["User-initiated enrollment","Automated Device Enrollment","PreStage enrollment","Zero-touch deployment"],"ans":0,"why":"User-initiated enrollment is started by the user after setup.","hint":"This method starts after the device is already set up: the person opens a link or an invitation, rather than enrolling during Setup Assistant."},{"id":"D25","exam":"D","topic":"INV","q":"Advanced searches can be saved so you can run them again later.","opts":["True","False"],"ans":0,"why":"Saved advanced searches can be rerun and shared with other admins.","hint":"Think about whether you can keep an advanced search and run it again later, and whether other admins can use it too."},{"id":"D26","exam":"D","topic":"INV","q":"Where in a mobile device's inventory record do you send a remote command such as Lock Device?","opts":["The Management tab","The Purchasing section","The History tab","Settings > Global"],"ans":0,"why":"Management lists available MDM commands for that device.","hint":"On that device's record, look for the tab about managing it — that is where remote commands such as Lock live, not History or Purchasing."},{"id":"D27","exam":"D","topic":"INV","q":"What is the difference between a computer's Last Check-in and Last Inventory Update?","opts":["Last Check-in is the last contact to check for policies; Last Inventory Update is the last full inventory submission","They always match","Last Check-in is only for iPhones","Last Inventory Update is the enrollment date"],"ans":0,"why":"Computers check in often but submit full inventory less frequently.","hint":"One timestamp is a quick 'anything for me to do?' visit. The other is the last time the Mac sent a full set of facts about itself. They are not always the same."},{"id":"D28","exam":"D","topic":"INV","q":"Which inventory section tracks details such as PO number, vendor and warranty expiration?","opts":["Purchasing","Hardware","Operating System","Disk Encryption"],"ans":0,"why":"Purchasing holds procurement and warranty data.","hint":"This section is about buying the device: purchase order, vendor, and warranty dates — not hardware specs."},{"id":"D29","exam":"D","topic":"INV","q":"What are extension attributes used for?","opts":["Collecting custom inventory data Jamf Pro does not collect by default","Extending the push certificate","Extending policy deadlines","Adding disk space"],"ans":0,"why":"EAs add custom fields to inventory, filled by a script, text, a pop-up menu or the directory.","hint":"These are extra inventory fields you add for facts Jamf Pro does not already collect, filled by a script, text, a menu, or the directory."},{"id":"D30","exam":"D","topic":"GRP","q":"IT wants to find Macs with less than 20 GB free space and fix them automatically. What is the best tool?","opts":["A smart group with a disk space criterion, used to scope a policy","A static group updated weekly","A category","A network segment"],"ans":0,"why":"Smart groups update as inventory changes, so the policy reaches each Mac that qualifies.","hint":"You want a list that updates itself as free space changes, then a policy aimed at that list — not a hand-updated list or a category."},{"id":"D31","exam":"D","topic":"GRP","q":"Jamf Pro supports smart and static user groups as well as device groups.","opts":["True","False"],"ans":0,"why":"There are computer, mobile device and user groups, each smart or static.","hint":"Besides computer and mobile device groups, think about whether you can also group people, and whether those groups can be rule-based or hand-picked."},{"id":"D32","exam":"D","topic":"GRP","q":"A smart group has 'Operating System Version less than 15.0' AND 'Building is HQ'. Which computer is a member?","opts":["A Mac on macOS 14.6 at HQ","A Mac on macOS 15.1 at HQ","A Mac on macOS 14.6 in Austin","A Mac on macOS 15.1 in Austin"],"ans":0,"why":"With AND, both conditions must be true.","hint":"When two rules are joined with AND, both have to be true. Check the macOS version and the building together."},{"id":"D33","exam":"D","topic":"GRP","q":"What happens if a computer smart group has no criteria?","opts":["It includes all computers","It includes no computers","It cannot be saved","It includes only new computers"],"ans":0,"why":"With nothing to filter on, every computer matches.","hint":"If you set no rules at all, there is nothing to filter on. Who is left in the list?"},{"id":"D34","exam":"D","topic":"CFG","q":"Which payload can disable features such as the camera or AirDrop?","opts":["Restrictions","Wi-Fi","Certificate","Login Window"],"ans":0,"why":"Restrictions turns features off or on.","hint":"The payload that turns features off — such as the camera or AirDrop — is named after those limits."},{"id":"D35","exam":"D","topic":"CFG","q":"Which payload preconfigures a wireless network so devices join it automatically?","opts":["Wi-Fi","VPN","Proxy","Mail"],"ans":0,"why":"The Wi-Fi payload holds the SSID, security type and credentials.","hint":"The payload is named after the wireless network itself: network name, security type, and the password or certificate."},{"id":"D36","exam":"D","topic":"CFG","q":"You can upload an existing .mobileconfig file to Jamf Pro instead of building the profile from scratch.","opts":["True","False"],"ans":0,"why":"Profiles can be uploaded and then scoped like any other.","hint":"Think about whether Jamf Pro will accept a profile file you already have, then let you aim it at devices like any other profile."},{"id":"D37","exam":"D","topic":"CFG","q":"How can a configuration profile scoped to a computer group be limited to certain directory users?","opts":["Add the users as Limitations in scope","Put the users in a category","Add them to a network segment","It cannot be done"],"ans":0,"why":"Limitations narrow a scope by directory users, groups or network segments.","hint":"Scope has a way to narrow who gets something, using directory users or groups, without taking them out as exclusions."},{"id":"D38","exam":"D","topic":"CFG","q":"Which payload configures items in the macOS Dock?","opts":["Dock","Login Window","Restrictions","Energy Saver"],"ans":0,"why":"The Dock payload sets Dock items and behavior.","hint":"The payload is named after the row of apps and folders at the edge of the Mac screen."},{"id":"D39","exam":"D","topic":"DDM","q":"Because of Declarative Device Management, devices can apply some settings based on criteria even when offline.","opts":["True","False"],"ans":0,"why":"Declarations can activate on device conditions without waiting for the server.","hint":"In this newer model, some rules can turn on from conditions on the device itself, without waiting to hear from the server. What does that mean if the device is offline?"},{"id":"D40","exam":"D","topic":"DDM","q":"What can you do with Compliance Benchmarks results?","opts":["View compliance scores in the rule report and export them as CSV","Only view them on the device","Send them to Apple","Nothing; results are hidden"],"ans":0,"why":"Rule reports show scores and can be exported, with audit documents available to download.","hint":"You can read scores in a rule report and export them as a spreadsheet file. The results are not stuck only on the device."},{"id":"D41","exam":"D","topic":"POL","q":"What can users do with Self Service on a Mac?","opts":["Install approved apps and run IT-provided items on demand, without admin rights","Change Jamf Pro settings","Create smart groups","Renew the push certificate"],"ans":0,"why":"Self Service is an IT-curated catalog that runs with management privileges.","hint":"On a Mac, this app is a catalog IT sets up so people can install approved items themselves, without needing admin rights."},{"id":"D42","exam":"D","topic":"POL","q":"Jamf Self Service is also available for iPhone and iPad.","opts":["True","False"],"ans":0,"why":"Self Service for iOS and iPadOS offers apps, profiles and books.","hint":"Think about whether that same catalog exists for iPhone and iPad, for apps, profiles, and books."},{"id":"D43","exam":"D","topic":"POL","q":"Before a policy can install a package, where must the package be?","opts":["Uploaded to a distribution point such as JCDS","On the user's desktop","In Apple Business","In the push certificate"],"ans":0,"why":"Policies download packages from a distribution point.","hint":"The installer has to be on a distribution point — for example Jamf's cloud one — before a policy can download it. The desktop or Apple Business is not that place."},{"id":"D44","exam":"D","topic":"POL","q":"Which frequency runs a policy once for each user who logs in to a given computer?","opts":["Once per user per computer","Once per computer","Once per user","Ongoing"],"ans":0,"why":"Once per user per computer repeats for each new user on that Mac.","hint":"Read the frequency name carefully: once for each person who logs in, and it is tied to that particular computer."},{"id":"D45","exam":"D","topic":"POL","q":"What does the Restart Options payload control?","opts":["Whether and when the computer restarts after the policy","Self Service branding","Wi-Fi settings","Inventory timing"],"ans":0,"why":"Restart Options sets restart behavior for logged-in and logged-out states.","hint":"This payload is about what the Mac does after the policy: whether it restarts, and how that differs if someone is logged in."},{"id":"D46","exam":"D","topic":"POL","q":"Which trigger runs a policy as soon as a user logs in?","opts":["Login","Logout","Recurring Check-in","Custom"],"ans":0,"why":"The Login trigger fires when a user logs in.","hint":"The trigger is named after the moment a user signs in to the Mac."},{"id":"D47","exam":"D","topic":"SCR","q":"Scripts run by Jamf Pro policies run as root.","opts":["True","False"],"ans":0,"why":"The jamf binary runs scripts as root, so use $3 or another method to act as the logged-in user.","hint":"Policies run scripts with the highest system permission. If you need to act as the person at the keyboard, that takes an extra step, such as a special parameter."},{"id":"D48","exam":"D","topic":"SCR","q":"Which Terminal command lists all files in the current folder, including hidden ones, with details?","opts":["`ls -la`","`pwd`","`cd ~`","`mkdir -p`"],"ans":0,"why":"`-l` gives a long listing and `-a` includes hidden dot files.","hint":"You want a listing of the current folder that includes hidden files and shows details. Two short flags on the list command do that."},{"id":"D49","exam":"D","topic":"SCR","q":"Where can you give friendly labels to script parameters 4 to 11 so they show in a policy?","opts":["The script's Options tab in Jamf Pro","The policy's Restart Options","The package's info","Settings > SMTP"],"ans":0,"why":"Parameter labels set in the script record appear as field names in the policy.","hint":"Those friendly names are set on the script itself, on the tab for options, so they show up as field labels inside the policy."}]}};
const QUICKREF = [{"id": "policy-triggers", "title": "Policy triggers", "cat": "Policies", "path": "Computers > Policies > New > General payload", "fact": "Triggers are events that start a policy. Pre-defined triggers are Startup (startup script must be enabled in the Check-In section of Computer Management Settings), Login (login hooks must be enabled there too), Network State Change (for example a network connection, computer name, or IP address change), Enrollment Complete (immediately after enrollment finishes), Recurring Check-In (at the interval configured in Jamf Pro), and Custom (start the policy yourself with jamf policy -event; for an iBeacon region change, use beaconStateChange).", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Triggers_for_Policies", "sourceTitle": "Triggers for Policies", "aliases": "trigger custom trigger startup login enrollment complete network state change beaconStateChange jamf policy -event"}, {"id": "policy-frequency", "title": "Policy execution frequencies", "cat": "Policies", "path": "Computers > Policies > New > General payload", "fact": "A policy can run Once per computer (one time only for each computer in scope; if a log entry exists, it will not run again until that log is flushed; you can also automatically re-run on failure up to 10 times), Once per user per computer, Once per user (through Self Service when user logins are enabled; once per username, not once per username per computer), Once every day (if no policy log in the past 24 hours), Once every week (168 hours), Once every month (30 days / 720 hours), or Ongoing (each time the specified trigger happens).", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Execution_Frequency_for_Policies", "sourceTitle": "Execution Frequency for Policies", "aliases": "execution frequency once per computer once per user ongoing once every day week month flush logs retry"}, {"id": "ongoing-checkin-warning", "title": "Ongoing frequency plus recurring check-in", "cat": "Policies", "path": "Computers > Policies > General payload", "fact": "When you use an ongoing execution frequency with a recurring check-in trigger, the policy runs during every check-in. Jamf warns this may negatively impact server and client performance.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Execution_Frequency_for_Policies", "sourceTitle": "Execution Frequency for Policies", "aliases": "ongoing recurring check-in performance"}, {"id": "checkin-default", "title": "Recurring check-in frequency (default 15 minutes)", "cat": "Policies", "path": "Settings > Computer management > Check-in", "fact": "The recurring check-in frequency is the interval at which computers check in with Jamf Pro for available policies. By default it is set to Every 15 Minutes. Configure it under Settings, in the Computer management section, at Check-in. Each computer checks in at that interval starting from when the setting is applied, so check-in times vary across computers.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Recurring_Check-in_Frequency", "sourceTitle": "Recurring Check-in Frequency", "aliases": "check-in checkin every 15 minutes interval Computer Management Settings"}, {"id": "create-policy", "title": "Where to create a policy", "cat": "Policies", "path": "Computers > Policies > New", "fact": "Create a policy under Computers > Policies > New. Use the General payload for the trigger and execution frequency, other payloads for the tasks, the Scope tab for who gets it, optionally the Self Service tab to offer it to users, and optionally the User Interaction tab for messages or deferral. After you save, the policy runs on computers in scope the next time they check in with Jamf Pro and meet the General payload criteria.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Creating_a_Policy", "sourceTitle": "Creating a Policy", "aliases": "create policy new policy self service tab user interaction payload"}, {"id": "update-inventory-policy", "title": "Built-in Update Inventory policy", "cat": "Inventory", "path": "Computers > Policies (Update Inventory)", "fact": "Jamf Pro includes a preconfigured policy called Update Inventory. By default, the Maintenance payload instructs all computers to submit inventory once a week. You can change the frequency or delete the policy. Jamf recommends keeping it active so inventory stays up to date. Removing a target from a policy's scope does not remove settings the policy already applied.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Policies", "sourceTitle": "Policies", "aliases": "update inventory maintenance payload weekly inventory policy"}, {"id": "manual-policy", "title": "Manually run a policy with the jamf binary", "cat": "jamf binary", "path": "On the Mac, in Terminal (or over SSH)", "fact": "Policies usually run from the jamf binary based on the trigger and frequency in Jamf Pro, but you can run them manually. sudo jamf policy -id 15 runs that policy ID (the ID is in the policy URL, for example policies.html?id=133). The computer must be in scope or the command fails. sudo jamf policy -event login runs all scoped policies with that trigger (use startup, login, logout, networkStateChange, or enrollmentComplete). For Recurring Check-in, run sudo jamf policy with no event. A policy with a custom trigger must be run manually with the jamf binary. Add -verbose for troubleshooting.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Manually_Running_a_Policy", "sourceTitle": "Manually Running a Policy", "aliases": "jamf policy -id -event -verbose custom trigger sudo jamf policy logout networkStateChange enrollmentComplete"}, {"id": "jamf-binary-location", "title": "Where the jamf binary lives and jamf -help", "cat": "jamf binary", "path": "/usr/local/jamf/bin/jamf (symlink at /usr/local/bin/jamf)", "fact": "The jamf binary executes most Jamf Pro tasks. It is installed at /usr/local/jamf/bin/jamf, with a symbolic link at /usr/local/bin/jamf so it can be found in default search paths. It is installed, updated, and run automatically on enrolled computers, and you can also use it to run commands yourself. To learn the commands, run jamf -help. Client log messages from the binary are written to /var/log/jamf.log.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Components_Installed_on_Managed_Computers", "sourceTitle": "Components Installed on Managed Computers", "aliases": "jamf binary /usr/local/jamf/bin/jamf jamf -help jamf.log path location command line"}, {"id": "jamf-recon", "title": "jamf recon (submit inventory now)", "cat": "jamf binary", "path": "On the Mac, in Terminal", "fact": "You can trigger an inventory update on a local computer by executing the jamf recon command in Terminal. Inventory is otherwise collected by the Jamf management framework, by MDM commands (typically issued right after framework inventory commands), and, for some attributes, by the declarative status channel, which can report a change immediately.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Computer_Inventory_Information", "sourceTitle": "Computer Inventory Information", "aliases": "recon jamf recon inventory update submit inventory terminal"}, {"id": "checkin-launchdaemon", "title": "Launch daemon that handles recurring check-in", "cat": "jamf binary", "path": "/Library/LaunchDaemons/com.jamfsoftware.task.1.plist", "fact": "On a managed Mac, /Library/LaunchDaemons/com.jamfsoftware.task.1.plist manages the recurring check-in to the Jamf Pro server. com.jamfsoftware.startupItem.plist is used to check for policies with a startup trigger, and com.jamf.management.login.plist monitors user login events.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Components_Installed_on_Managed_Computers", "sourceTitle": "Components Installed on Managed Computers", "aliases": "launchdaemon launch daemon com.jamfsoftware.task.1.plist startupItem login.plist"}, {"id": "apns-push-cert", "title": "APNs push certificate", "cat": "Apple services", "path": "Settings > Global > Push certificates", "fact": "A push certificate is an encrypted file from Apple that establishes trust between Jamf Pro and Apple Push Notification service (APNs). Enrollment establishes trust between devices and Jamf Pro; the push certificate establishes trust between Jamf Pro and APNs. Both are required to manage devices. Jamf Pro relies on APNs to initiate communication. After a push, the device is notified to contact the Jamf Pro server address in its MDM profile, then it polls Jamf Pro for commands. Each certificate is valid for one year and must be renewed with the same Apple Account used to generate it. Uploading a push certificate automatically enables Enable push notifications in Security settings.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Push_Certificates", "sourceTitle": "Push Certificates", "aliases": "APNs APN push certificate CSR Apple Push Certificates Portal one year renew Apple Account"}, {"id": "create-push-cert", "title": "Where to create or upload a push certificate", "cat": "Apple services", "path": "Settings > Global > Push certificates > New", "fact": "In Jamf Pro, click Settings in the sidebar, then in the Global section click Push certificates, then New. Jamf Pro generates a certificate signing request (CSR) that is signed by Jamf and submitted to the Apple Push Certificates Portal (identity.apple.com/pushcert). Apple generates the certificate, which you upload back to Jamf Pro. Jamf recommends an institutional Apple Account, not a personal one, because the same account is required every year to renew.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Creating_a_Push_Certificate", "sourceTitle": "Creating a Push Certificate", "aliases": "create push certificate Settings Global identity.apple.com CSR JamfSignedCSR"}, {"id": "ade-overview", "title": "Automated Device Enrollment (ADE) and ABM/ASM", "cat": "Enrollment", "path": "Settings (Automated Device Enrollment integration), then Computers or Devices > PreStage enrollments", "fact": "Apple's Automated Device Enrollment, also called zero-touch deployment, enrolls and configures a device when a user turns it on, with no IT interaction required. It is most commonly used for organization-owned devices and is the only method that can prevent end users from removing the MDM profile. Integrate Jamf Pro by downloading a public key, obtaining a service token from Apple Business or Apple School Manager, and uploading the token. You can add multiple ADE instances. Jamf Pro automatically syncs ADE updates from Apple every two minutes. Deleting an ADE instance in Jamf Pro removes the integration there but does not delete the settings in Apple Business or Apple School Manager.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Automated_Device_Enrollment_Integration", "sourceTitle": "Automated Device Enrollment Integration", "aliases": "ADE DEP Automated Device Enrollment zero-touch ABM ASM Apple Business Manager Apple School Manager service token public key unremovable MDM profile"}, {"id": "prestage-what", "title": "PreStage enrollments", "cat": "Enrollment", "path": "Computers > PreStage enrollments (or Devices > PreStage enrollments)", "fact": "PreStage enrollments let you configure and deploy the Automated Device Enrollment experience. The PreStage scope specifies which devices enroll with those settings, and only devices associated with the chosen ADE instance are eligible. Computers must have internet access during Setup Assistant so they can check in with Jamf Pro and receive the initial enrollment configuration. If you clone a PreStage, the original scope is not copied. To move a computer between PreStages, remove it from the first scope and then add it to the new one.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Computer_PreStage_Enrollments", "sourceTitle": "Computer PreStage Enrollments", "aliases": "PreStage pre-stage Setup Assistant ADE enrollment scope skip screens automatically assign new devices"}, {"id": "prestage-create", "title": "Where to create a computer PreStage", "cat": "Enrollment", "path": "Computers > PreStage enrollments > New", "fact": "In Jamf Pro, click Computers, then PreStage enrollments, then New (or select one and click Edit). In the General payload, name the PreStage, choose an ADE instance, and optionally select Automatically assign new devices. You can skip Setup Assistant screens or, on macOS 11 or later, automatically advance through Setup Assistant (the device then defaults to Pacific Time unless you configure language and region). Use the Scope tab to select devices or Select All, then Save. When you save, settings sync with Apple (Jamf Pro syncs about every two minutes).", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Configuring_a_Computer_PreStage_Enrollment", "sourceTitle": "Creating or Editing a Computer PreStage Enrollment", "aliases": "create PreStage automatically assign new devices skip Setup Assistant automatically advance Pacific Time"}, {"id": "uie-url", "title": "User-initiated enrollment URL", "cat": "Enrollment", "path": "Settings > Global > User-initiated enrollment", "fact": "Enrollment adds computers and mobile devices to Jamf Pro and establishes a connection to the server. User-initiated enrollment lets users start enrollment themselves by opening an enrollment URL, for example https://JAMF_PRO_URL.jamfcloud.com/enroll (Jamf Cloud) or https://JAMF_PRO_URL.com:8443/enroll (on-premise). Users must use Safari to open the enrollment URL on mobile devices. Users can enroll Mac computers, institutionally owned mobile devices, and personally owned mobile devices.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/User-Initiated_Enrollment_Settings", "sourceTitle": "User-Initiated Enrollment Settings", "aliases": "user-initiated enrollment UIE /enroll enrollment URL Safari BYOD personally owned"}, {"id": "uie-settings", "title": "Where to configure user-initiated enrollment", "cat": "Enrollment", "path": "Settings > Global > User-initiated enrollment", "fact": "In Jamf Pro, click Settings, then in the Global section click User-initiated enrollment, then Edit. Use the General tab for re-enrollment restrictions, skipping certificate installation (skipped by default), or a third-party signing certificate. Use Messaging to customize enrollment text (including multiple languages). Use the Computers tab to enable user-initiated enrollment and configure the Mac management account. Use the Devices tab to enable account-driven User Enrollment (Managed Apple Account) for mobile devices. Use the Access tab to allow an LDAP group to enroll with a URL without an invitation.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Configuring_the_User-Initiated_Enrollment_Settings", "sourceTitle": "Configuring User-Initiated Enrollment Settings", "aliases": "configure user-initiated enrollment management account Messaging Access LDAP invitation skip certificate"}, {"id": "management-account-warning", "title": "Management account: do not reuse the PreStage username", "cat": "Enrollment", "path": "Settings > Global > User-initiated enrollment > Computers, and PreStage Account Settings", "fact": "To create the managed local administrator (management) account during user-initiated enrollment, enable UIE and configure the username and account settings; the jamf binary creates that account at enrollment. Do not use the same username for the UIE management account and a managed local administrator account in a PreStage. If you do, those accounts may not be created correctly during Automated Device Enrollment, unexpected errors may occur, and the LAPS password will not be retrievable in the Jamf Pro API. The management account must be created to use LAPS. You can see if a computer is managed in the Managed inventory field.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Management_Account_Creation_During_Computer_Enrollment", "sourceTitle": "Managed Local Administrator Account Creation During Computer Enrollment", "aliases": "management account managed local administrator LAPS username PreStage warning"}, {"id": "mdm-enabled-user", "title": "Which enrollment methods MDM-enable a user", "cat": "Enrollment", "path": "Depends on the method (PreStage, user-initiated enrollment, or older agent enrollment)", "fact": "With a computer PreStage (ADE, formerly DEP), users created during Setup Assistant are MDM-enabled, unless account creation was skipped and the account was made by a policy or Jamf Connect, or (Jamf Pro 10.24+ / macOS 11+) Make the local administrator account MDM-enabled is selected in the PreStage Account Settings payload (in that case that administrator is the MDM-enabled user). With user-initiated enrollment, the logged-in user is MDM-enabled after enrollment by default. Network and mobile user accounts are MDM-enabled by default regardless of enrollment method.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Enrollment_Methods_that_Enable_MDM_for_Users", "sourceTitle": "Enrollment Methods that Enable MDM for Users", "aliases": "MDM-enabled user Setup Assistant DEP user-initiated logged-in user"}, {"id": "enrollment-invitation", "title": "Computer enrollment invitations", "cat": "Enrollment", "path": "Computers > Enrollment invitations > New", "fact": "Email enrollment invitations give more control over the enrollment portal: you can set an expiration date, require a portal login, allow multiple uses, add the device to a site, and view invitation status (for example email sent, email failed, or enrollment completed). Requirements include device enrollment enabled in User-initiated enrollment settings, an LDAP server if you use LDAP sign-in, and an SMTP server to send email. Create one under Computers > Enrollment invitations > New. Jamf Pro does not retry a failed invitation email.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Sending_a_Computer_Enrollment_Invitation", "sourceTitle": "Sending a Computer Enrollment Invitation via Email", "aliases": "enrollment invitation email expire SMTP LDAP site multiple uses"}, {"id": "smart-groups", "title": "Smart groups", "cat": "Groups", "path": "Computers, Devices, or Users > Smart computer groups / Smart device groups / Smart user groups", "fact": "Smart group membership is dynamically updated from inventory criteria you add. You can make smart groups for managed computers, mobile devices, or users. Jamf recommends smart groups for scoping, deployment, and actionable items; use advanced search for information gathering, queries, and reports. Avoid circular smart groups that rely on each other's membership, and avoid excessive nesting, which can hurt server performance. If you combine two criteria about the same kind of item (such as apps), list the name criterion first.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Smart_Groups", "sourceTitle": "Smart Groups", "aliases": "smart group dynamic membership criteria nested circular advanced search vs smart group"}, {"id": "create-smart-group", "title": "Where to create a smart group and when membership updates", "cat": "Groups", "path": "Computers, Devices, or Users > Smart computer groups (or device/user) > New > Criteria", "fact": "Click Computers, Devices, or Users, then Smart computer groups, Smart Device Groups, or Smart user groups, then New. Add criteria on the Criteria tab (only the 30 most used criteria are listed until you click Show Advanced Criteria). A smart group with no criteria includes all managed computers, devices, or users. Membership updates when computers submit inventory (or, for some attributes such as Last Check-in, when they check in), when mobile devices contact Jamf Pro, or when user information is edited. You can optionally email on membership change.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Creating_a_Smart_Group", "sourceTitle": "Creating a Smart Group", "aliases": "create smart group criteria And/Or Show Advanced Criteria Last Check-in membership update email notification"}, {"id": "static-groups", "title": "Static groups", "cat": "Groups", "path": "Computers, Devices, or Users > Static computer groups / Static device groups / Static user groups > New > Assignments", "fact": "Static groups have membership you assign by hand. Create one under Computers, Devices, or Users, then Static computer groups, Static device groups, or Static user groups, then New. On the Assignments tab, select each computer, device, or user (or select all). Computers become members the next time they check in with Jamf Pro; mobile devices become members the next time they contact Jamf Pro.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Creating_a_Static_Group", "sourceTitle": "Creating a Static Group", "aliases": "static group assignments manual membership fixed group"}, {"id": "scope", "title": "Scope", "cat": "Groups", "path": "The Scope tab of a policy, profile, app, or other object", "fact": "Scope controls which computers, mobile devices, and users receive a remote management task. It can be based on individual computers, devices, or users; computer, device, or user groups; departments; buildings; directory service or local users; directory service user groups; network segments; classes (book scope only); and iBeacon regions. The available items depend on the task. Scope cannot be based on personally owned mobile devices. If you need many directory service groups in a scope, Jamf suggests putting those criteria in a smart group and scoping to that group, because too many directory groups in scope may cause performance issues.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Scope", "sourceTitle": "Scope", "aliases": "scope targets limitations departments buildings network segments classes iBeacon LDAP groups"}, {"id": "config-profiles", "title": "Computer configuration profiles", "cat": "Profiles", "path": "Computers > Configuration profiles", "fact": "Configuration profiles are XML files (.mobileconfig) that define settings and restrictions for devices, computers, and users. You can create a profile in Jamf Pro or upload one made with third-party software. For a computer profile you must choose computer-level or user-level; each level has its own payloads, with a few in common. User-level profiles may not apply until the MDM-enabled user logs out and back in, or the computer is restarted. You can install a profile automatically (no user interaction) or make it available in Self Service.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Computer_Configuration_Profiles", "sourceTitle": "Computer Configuration Profiles", "aliases": "configuration profile .mobileconfig payload computer-level user-level Self Service MDM"}, {"id": "create-profile", "title": "Where to create a computer configuration profile", "cat": "Profiles", "path": "Computers > Configuration profiles > New", "fact": "In Jamf Pro, click Computers, then Configuration profiles, then New. Use the General payload to set the level (computer-level or user-level) and the distribution method; only payloads for the selected level are shown. To distribute a profile during enrollment with a computer PreStage, create a computer-level profile whose scope includes the computers in that PreStage. Set Scope, and if you made it available in Self Service, configure the Self Service tab. If a blueprint payload has conflicting keys (for example in Restrictions), unexpected behavior may occur; for Restrictions, the most restrictive setting takes precedence.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Manually_Creating_a_Configuration_Profile_macOS", "sourceTitle": "Creating a Computer Configuration Profile in Jamf Pro", "aliases": "create configuration profile Computers Configuration profiles New"}, {"id": "inventory-collection", "title": "Computer inventory collection settings", "cat": "Inventory", "path": "Settings > Computer management > Inventory Collection", "fact": "Basic inventory\u2014hardware, operating system, user and location, storage, and applications\u2014is collected automatically. Under Settings > Computer management > Inventory Collection you can also collect local user accounts (optionally including home directory sizes and hidden system accounts), printers, active services, last backup time for managed mobile devices synced to the Mac, user and location from a directory service (if LDAP or a Cloud Identity Provider is set up), package receipts, available software updates, application usage, and iBeacon regions. You can also prevent collection of unmanaged certificates and specify custom application search paths.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Computer_Inventory_Collection_Settings", "sourceTitle": "Computer Inventory Collection Settings", "aliases": "inventory collection settings local user accounts printers package receipts application usage iBeacon LDAP location"}, {"id": "simple-search", "title": "Simple computer searches", "cat": "Inventory", "path": "Computers > Search inventory", "fact": "A simple computer search works like a search engine and returns a general range of results. You can search computers (managed and unmanaged) by name, MAC address, bar code, IP address, asset tag, serial number, username, full name, email, phone, position, department, building, or room. You can also search applications by name. Local user accounts, application usage, package receipts, printers, services, and software updates are searchable only if Jamf Pro is set to collect them. Computers and applications are searchable by default.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Simple_Computer_Searches", "sourceTitle": "Simple Computer Searches", "aliases": "simple search serial number asset tag MAC address inventory search"}, {"id": "advanced-search", "title": "Advanced computer searches", "cat": "Inventory", "path": "Computers > Search inventory > New", "fact": "Create an advanced search under Computers > Search inventory > New. Add criteria (Show Advanced Criteria to see more than the 30 most used), join them with And/Or and parentheses, and use the Display tab to choose which attribute fields appear in results. Select Save this Search to keep it. Saved search results are updated each time you view the membership. You can export results or perform mass actions on them.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Creating_an_Advanced_Computer_Search", "sourceTitle": "Creating an Advanced Computer Search", "aliases": "advanced search Search inventory criteria Display tab saved search reports mass actions"}, {"id": "extension-attributes", "title": "Computer extension attributes", "cat": "Extension attributes", "path": "Settings > Computer management > Extension attributes", "fact": "Extension attributes collect extra inventory information. Input types are text field, pop-up menu, script, or Directory Service attribute mapping. You can create them manually, from a template, or with the Jamf Pro API. They can be used as smart group criteria or as a variable in a configuration profile. Script and some other types can add time and network traffic to inventory collection. Renaming an extension attribute can break scoping if it is used as smart group criteria.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Computer_Extension_Attributes", "sourceTitle": "Computer Extension Attributes", "aliases": "extension attribute EA text field pop-up menu script LDAP directory mapping inventory"}, {"id": "ea-script-result", "title": "Script extension attributes and <result> tags", "cat": "Extension attributes", "path": "Settings > Computer management > Extension attributes > New > Input Type: Script", "fact": "A script input runs each time a computer submits inventory. Scripts can be written in any language with an interpreter installed (commonly Bash, Perl, or Python). The text between the <result></result> tags is stored in Jamf Pro; if those tags are missing, a blank value is sent. Text fields and pop-up menus can be filled during enrollment or later in Jamf Pro. Directory Service mapping requires an LDAP server and inventory collection of user and location from LDAP.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Extension_Attribute_Input_Types_macOS", "sourceTitle": "Extension Attribute Input Types", "aliases": "<result> script bash perl python inventory extension attribute input type"}, {"id": "create-ea", "title": "Where to create a computer extension attribute", "cat": "Extension attributes", "path": "Settings > Computer management > Extension attributes > New", "fact": "In Jamf Pro, click Settings, then in the Computer management section click Extension attributes, then New. Name it, optionally add a description, choose a data type, choose an Inventory Display category, choose an input type, and save.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Manually_Creating_a_Computer_Extension_Attribute", "sourceTitle": "Manually Creating a Computer Extension Attribute", "aliases": "create extension attribute Settings Computer management"}, {"id": "ldap", "title": "LDAP directory service integration", "cat": "Directory", "path": "Settings (LDAP servers / Cloud Identity Providers)", "fact": "You can integrate any number of LDAP directory services to look up and populate user information for inventory, add Jamf Pro user accounts or groups from LDAP, require LDAP login to Self Service or the enrollment portal, require LDAP login during mobile device setup, and base scope on directory users or groups. Too many LDAP groups in a scope can hurt performance; if you need many, put the criteria in a smart group and scope to that group. Jamf Cloud talking to on-premise Active Directory needs a Jamf Infrastructure Manager (LDAP proxy). On-premise environments can use the LDAP Server Assistant (Open Directory, Active Directory, or NetIQ eDirectory).", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/LDAP_Directory_Service_Integration", "sourceTitle": "LDAP Directory Service Integration", "aliases": "LDAP Active Directory Open Directory eDirectory Infrastructure Manager LDAP proxy Cloud Identity Provider"}, {"id": "self-service", "title": "Self Service for macOS", "cat": "Self Service", "path": "Settings (Self Service), and the Self Service tab on policies, profiles, and apps", "fact": "Self Service classic and Self Service+ let users access content, perform updates, and make approved changes on their Macs. Users can browse and install configuration profiles, Mac App Store apps, and books; run policies; update third-party software via patch policies; and open bookmarks. You manage installation, user authentication, which items appear, which computers show them, and which users can access them from Jamf Pro. You can also brand the name, icon, and header. Jamf currently describes Self Service classic as deprecated in an upcoming release and no longer recommended as the default; Self Service+ is the newer end-user app.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Jamf_Self_Service_for_macOS", "sourceTitle": "Self Service for macOS", "aliases": "Self Service Self Service+ classic patch policies bookmarks branding"}, {"id": "self-service-auto-install", "title": "Automatically installing Self Service for macOS", "cat": "Self Service", "path": "Settings > Self Service > macOS", "fact": "To install Self Service for macOS automatically: in Jamf Pro, click Settings, then in the Self Service section click macOS, click Edit, select the Install Automatically checkbox, optionally set the installation location, and click Save. Self Service is then installed on all managed computers the next time they check in with Jamf Pro, and on computers as they are newly enrolled.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Installing_Self_Service_for_macOS_Automatically", "sourceTitle": "Installing Self Service for macOS Automatically", "aliases": "install Self Service automatically enrollment"}, {"id": "packages", "title": "Packages", "cat": "Scripts & packages", "path": "Settings (or Computers) package management, then deploy with a policy Packages payload", "fact": "In Jamf Pro, a package means an Apple Installer package (PKG) or a disk image (DMG) used to deploy software and files. You can build packages with Composer or a third-party tool. Managing a package means adding it to your distribution point and to Jamf Pro, then configuring its settings. After that you deploy it with a policy. You can also download previously added packages from Jamf Pro.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Packages", "sourceTitle": "Packages", "aliases": "package PKG DMG Composer distribution point policy deploy software"}, {"id": "scripts", "title": "Scripts in Jamf Pro", "cat": "Scripts & packages", "path": "Settings (Scripts), then add the script to a policy Scripts payload", "fact": "Adding a script to Jamf Pro lets you label parameters (for example label $4 as Printer name, which then appears when you add the script to a policy), specify operating system requirements so Jamf Pro skips incompatible computers, set script priority relative to other policy items (for example After, so a new local account exists before the script runs), and put the script in a category. Categories also group policies, packages, scripts, and printers in Jamf Pro, and can group items in Self Service.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Scripts", "sourceTitle": "Scripts", "aliases": "script $4 parameter priority Before After OS requirement category"}, {"id": "categories", "title": "Categories", "cat": "Scripts & packages", "path": "Settings > Categories (and in Self Service item settings)", "fact": "Categories let you group policies, packages, scripts, and printers in Jamf Pro. You can also use categories to group policies, configuration profiles, apps, and books in Self Service so those items are easier to find.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Categories", "sourceTitle": "Categories", "aliases": "category categories Self Service group items"}, {"id": "distribution-points", "title": "Distribution points", "cat": "Server settings", "path": "Settings (Server infrastructure / distribution points)", "fact": "Distribution points host files for distribution to computers and mobile devices: packages, in-house apps, and in-house books. Jamf Pro supports file share distribution points and a cloud distribution point, and you can use any combination. By default, the first distribution point you add is the principal distribution point; you can change that later. On macOS 10.15 or later computers that do not have an MDM profile, you must use an HTTP, HTTPS, or cloud distribution point to install packages.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/About_Distribution_Points", "sourceTitle": "About Distribution Points", "aliases": "distribution point file share cloud JCDS principal HTTP HTTPS packages"}, {"id": "vpp", "title": "Volume Purchasing (apps and books) and ABM/ASM", "cat": "Apple services", "path": "Settings (Volume Purchasing / content tokens from Apple Business or Apple School Manager)", "fact": "The volume purchasing integration syncs with Apple Business or Apple School Manager and automatically populates your apps and books in Jamf Pro for managed distribution to devices or users. In ABM or ASM, the Apps and Books section is where you purchase content in volume; all purchased content is associated with a content token. You can have a default location plus additional locations (for example by office, department, or budget). In Jamf Pro you upload each content token so apps and books sync, and you can view used and available licenses for paid apps.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Volume_Purchasing_Integration", "sourceTitle": "Volume Purchasing Integration", "aliases": "VPP Volume Purchasing Apps and Books content token licenses ABM ASM managed distribution"}, {"id": "accounts-privileges", "title": "Jamf Pro user accounts, groups, and privilege sets", "cat": "Accounts & privileges", "path": "Settings > System > User accounts & groups", "fact": "Jamf Pro user accounts and groups grant different privileges and access (full Jamf Pro or a specific site). Privilege sets are Administrator (all privileges), Auditor (all read privileges), Enrollment Only (privileges needed to enroll computers and devices, including logging in, and creating/reading/deleting enrollment invitations), and Custom (you grant privileges by hand; a function may need privileges on more than one object). Group members inherit the group's access and privileges. You can create standard accounts/groups or add them from a directory service. Jamf recommends at least one account that is not from a directory service, in case that connection is interrupted, and multiple administrator accounts.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Jamf_Pro_User_Accounts_and_Groups", "sourceTitle": "Jamf Pro User Accounts and Groups", "aliases": "user accounts groups Administrator Auditor Enrollment Only Custom privileges site access LDAP"}, {"id": "create-account", "title": "Where to create a Jamf Pro user account", "cat": "Accounts & privileges", "path": "Settings > System > User accounts & groups > New", "fact": "In Jamf Pro, click Settings, then in the System section click User accounts & groups, then New. You can create a standard account, add an LDAP account (requires an LDAP server or cloud identity provider), or create a federated (passwordless) account for OIDC single sign-on with Jamf Account. Choose an access level: Full Access, Site Access (only listed if sites exist), or Group Access (only listed if standard groups exist). For full or site access, choose a privilege set; if you choose Custom, use the Privileges tab to select each privilege.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Creating_a_Jamf_Pro_User_Account", "sourceTitle": "Creating a Jamf Pro User Account", "aliases": "create user account Settings System User accounts and groups Full Access Site Access Privileges tab federated OIDC"}, {"id": "server-actions", "title": "Jamf Pro Server Actions (privilege category)", "cat": "Accounts & privileges", "path": "Settings > System > User accounts & groups > Privileges tab (Custom privilege set)", "fact": "When you grant a Custom privilege set, privileges are grouped by category. One official category is Jamf Pro Server Actions, which controls whether a user may perform certain actions (not just view objects). For example, the privilege View Disk Encryption Recovery Key is listed under Jamf Pro Server Actions and allows viewing a personal FileVault recovery key, and viewing or downloading an institutional recovery key. Related object privileges, such as Disk Encryption Configurations, are listed under Jamf Pro Server Objects.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Viewing_the_FileVault_Recovery_Key_for_a_Computer", "sourceTitle": "Viewing the FileVault Recovery Key for a Computer", "aliases": "Jamf Pro Server Actions privileges FileVault recovery key Server Objects Custom privileges"}, {"id": "sites", "title": "Sites", "cat": "Server settings", "path": "Settings (Sites), and Access Level = Site Access on user accounts", "fact": "Sites let full administrators decide which objects (for example computers, devices, or apps) other Jamf Pro users can view and manage. Sites do not have to match physical locations. Only create sites when you need to let some users manage a subset of objects. Full administrators can add and modify sites and instance-wide settings. A site-access user can view and edit only objects in that site; if they have several sites, a menu at the top of the page switches between them.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Sites", "sourceTitle": "Sites", "aliases": "sites site access site-only administrator delegate"}, {"id": "log-flushing", "title": "Log flushing", "cat": "Server settings", "path": "Settings > System > Log flushing", "fact": "Flushing logs reduces database size and can speed up searches. You can flush application usage logs, computer usage logs, policy logs, screen sharing logs, computer and mobile device management history, computer and mobile device inventory reports, user reports, user and location history, Jamf Pro access logs, Change Management logs, event logs, and Jamf Application Deployments. You can schedule flushing daily or flush manually, and choose logs older than a number of weeks or months, or one year. Manually flush at Settings > System > Log flushing > Flush. Flushing a computer's policy log matters for Once per computer policies, which will not run again until that log is flushed.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Log_Flushing", "sourceTitle": "Log Flushing", "aliases": "log flushing flush policy logs database Settings System once per computer"}, {"id": "flush-policy-logs", "title": "Flush logs for one policy", "cat": "Policies", "path": "Computers > Policies > [policy] > Logs", "fact": "You can view and flush logs for a specific policy from that policy's Logs view, in addition to flushing policy logs globally under Settings > System > Log flushing. This is the usual way to allow a Once per computer policy to run again on a Mac that already has a log entry.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Viewing_and_Flushing_Logs_for_a_Policy", "sourceTitle": "Viewing and Flushing Logs for a Policy", "aliases": "flush policy log history once per computer run again"}, {"id": "security-settings", "title": "Security settings", "cat": "Server settings", "path": "Settings (Security)", "fact": "Security settings let you enable certificate-based authentication, enable push notifications, automatically install the Privacy Preferences Policy Control profile, automatically install a Jamf Notifications profile, specify when a checksum is used to validate packages (after download), set a maximum clock skew between managed computers and the Jamf Pro host server, and enable MDM LAPS for PreStage accounts and password settings for managed local administrator accounts. If a Mac does not meet the security requirements, communication with Jamf Pro is blocked.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Security_Settings", "sourceTitle": "Security Settings", "aliases": "security settings certificate-based authentication push notifications PPPC checksum clock skew MDM LAPS"}, {"id": "smtp", "title": "SMTP server integration", "cat": "Server settings", "path": "Settings (SMTP server settings)", "fact": "Integrating with an SMTP server lets you send email notifications to Jamf Pro users when certain events occur, send user-initiated enrollment invitations via email, and send mass emails to end users. To integrate, configure the SMTP server settings in Jamf Pro.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/SMTP_Server_Integration", "sourceTitle": "SMTP Server Integration", "aliases": "SMTP email enrollment invitation mail server Graph Google"}, {"id": "remote-commands", "title": "Remote commands (MDM commands) for computers", "cat": "MDM commands", "path": "A computer's inventory record (Management), or mass actions on search/group results", "fact": "Remote commands let you perform tasks on computers from Jamf Pro. You can send a command to one computer; some commands can also be sent to many computers with mass actions (those are marked with an asterisk in the official table). Examples: Lock Computer* logs the user out, restarts, and locks the Mac (the user unlocks with the passcode you specified); Remove MDM Profile removes the MDM profile and configuration profiles (Jamf Pro can then no longer send commands or profiles or use APNs, but if the jamf binary remains the Mac is only partially unmanaged and can still get policies and inventory); Renew MDM Profile* renews the MDM profile and device identity certificate (default expiration two years); Wipe Computer erases the Mac; Send Blank Push contacts APNs and the declarative status channel so the computer checks in for instructions.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Remote_Commands_for_Computers", "sourceTitle": "Remote Commands for Computers", "aliases": "remote commands MDM commands lock wipe remove MDM profile renew MDM profile blank push mass actions Management History"}, {"id": "remove-mdm-partial", "title": "Remove MDM Profile leaves the jamf binary unless you unmanage", "cat": "MDM commands", "path": "Computer record > Management > Remove MDM Profile", "fact": "The Remove MDM Profile command removes the MDM profile and any configuration profiles distributed with Jamf Pro. After that, Jamf Pro cannot send commands, deploy configuration profiles, or deploy settings that rely on APNs. If you do not also remove the Jamf management framework (including the jamf binary), the computer stays partially managed: it will still update inventory, receive policies, enforce restricted software, and perform other framework-managed actions.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Remote_Commands_for_Computers", "sourceTitle": "Remote Commands for Computers", "aliases": "unmanage remove MDM profile jamf binary partially managed policies still run"}, {"id": "blank-push", "title": "Send Blank Push", "cat": "MDM commands", "path": "Computer record > Management > Send Blank Push", "fact": "Send Blank Push contacts Apple Push Notification service (APNs) and the declarative status channel to prompt the computer to check in with Jamf Pro for instructions, such as installing a configuration profile.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Remote_Commands_for_Computers", "sourceTitle": "Remote Commands for Computers", "aliases": "blank push APNs check in configuration profile"}, {"id": "mass-actions", "title": "Mass actions for computers", "cat": "MDM commands", "path": "A smart or static group, or advanced search results", "fact": "Some remote commands and other tasks can be sent to multiple computers at once using mass actions, typically from a group or from advanced search results. The official Remote Commands table marks mass-action-capable commands with an asterisk, including Lock Computer and Renew MDM Profile.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Mass_Actions_for_Computers", "sourceTitle": "Mass Actions for Computers", "aliases": "mass action bulk commands group search results"}, {"id": "ddm", "title": "Declarative Device Management (DDM)", "cat": "Blueprints & updates", "path": "Used automatically on compatible devices; also used by blueprints and managed software updates", "fact": "Declarative device management adds capabilities to Apple's MDM protocol and can be used in addition to existing MDM commands. Compatible devices can proactively apply management settings and report state changes to the MDM server asynchronously, which means less communication and faster, more reliable updates. Jamf Pro automatically enables DDM on compatible managed devices. Changed subscribed status items are reported on the status channel and reflected in inventory (for example, a new macOS version can be reported immediately after the update). DDM is also used with managed software updates and with software update management in blueprints.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Declarative_Device_Management", "sourceTitle": "Declarative Device Management", "aliases": "DDM declarative device management status channel asynchronous inventory macOS version blueprints"}, {"id": "blueprints", "title": "Blueprints", "cat": "Blueprints & updates", "path": "Blueprints (Jamf Pro Blueprints; requires platform services / Cloud Services as documented in the Blueprints guide)", "fact": "Blueprints simplify complex workflows by using declarative device management so devices meet a particular management state. You scope management settings with customizable components that include payloads and their settings, all in one place. Devices can apply those scoped settings on their own and report state changes asynchronously.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Jamf_Platform_Services_and_Capabilities", "sourceTitle": "Jamf Platform Services and Capabilities", "aliases": "blueprints blueprint builder DDM declarations payloads"}, {"id": "compliance-benchmarks", "title": "Compliance Benchmarks", "cat": "Blueprints & updates", "path": "Compliance Benchmarks (see the Compliance Benchmarks Configuration Guide)", "fact": "Compliance Benchmarks is built on the macOS Security Compliance Project (mSCP) framework and helps organizations implement and maintain security standards across Mac fleets. It supports industry-standard frameworks such as Center for Internet Security (CIS) benchmarks so you can align with recognized best practices.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Jamf_Platform_Services_and_Capabilities", "sourceTitle": "Jamf Platform Services and Capabilities", "aliases": "compliance benchmarks mSCP CIS macOS Security Compliance Project"}, {"id": "managed-os-updates", "title": "Managed software updates for macOS", "cat": "Blueprints & updates", "path": "Computers or Devices (Managed Software Updates), scoped to smart or static groups", "fact": "Managed software updates in Jamf Pro can update the OS version and built-in apps. For the Download/Download and Install Updates remote command, you can target the latest eligible version or a specific version (specific versions require macOS 10.15 or later), optionally include major updates, and choose an install action: download for users to install, download and allow macOS to install later (deferral 0\u201399 times, default 7, on macOS 12.3 or later), or download, install, and restart. Declarative device management is also used with managed software updates.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Remote_Commands_for_Computers", "sourceTitle": "Remote Commands for Computers", "aliases": "managed software updates OS update download install deferral major update DDM"}, {"id": "pppc-checkin-note", "title": "PPPC safelist for policies that access network volumes", "cat": "Policies", "path": "Privacy Preferences Policy Control payload (installed automatically by default)", "fact": "On macOS 10.15 or later, Jamf Pro must be safelisted in the Privacy Preferences Policy Control payload to run policies that access data on a network volume at recurring check-in, and users may be prompted if it is not safelisted when such policies run through Self Service. By default, Jamf Pro is automatically safelisted in that payload.", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Triggers_for_Policies", "sourceTitle": "Triggers for Policies", "aliases": "PPPC Privacy Preferences Policy Control network volume safelist 10.15 Self Service"}, {"id": "utilities-help", "title": "Other Jamf utilities on the Mac", "cat": "jamf binary", "path": "Installed automatically on enrolled Macs", "fact": "Besides the jamf binary, enrolled Macs get the jamf agent (application usage and restricted software, at /usr/local/jamf/bin/jamfAgent), the Jamf.app bundle (JamfDaemon, JamfAAD for Microsoft Entra ID conditional access, and JamfManagementService, which executes external commands such as policies), jamfHelper.app (on-screen messages), and Management Action.app (User Interaction messages in Notification Center).", "source": "https://learn.jamf.com/r/en-US/jamf-pro-documentation-current/Utilities", "sourceTitle": "Utilities", "aliases": "jamfAgent jamfHelper Management Action JamfDaemon JamfAAD JamfManagementService Entra"}];
(function () {
  "use strict";

  const STORE = "jamf100-study-v1";
  const LIMIT = 3600;
  const PASS = 40;
  const LETTERS = ["A", "B", "C", "D"];
  const EXAM_IDS = ["A", "B", "C", "D"];
  const TOPICS = BANK.topics;
  const TOPIC_KEYS = Object.keys(TOPICS);
  let searchQ = "";
  let searchOpen = false;
  let searchSel = -1;
  let lookupCat = "all";
  let lookupFocus = "";

  function hash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
    return h;
  }

  function prep(row) {
    const opts = row.opts.slice();
    let ans = row.ans;
    if (opts.length !== 2) {
      const correct = opts[ans];
      const rest = opts.filter(function (_, i) { return i !== ans; });
      const pos = hash(row.q) % opts.length;
      opts.splice(0, opts.length, ...rest.slice(0, pos), correct, ...rest.slice(pos));
      ans = pos;
    }
    return {
      id: row.id,
      exam: row.exam,
      topic: row.topic,
      q: row.q,
      opts: opts,
      ans: ans,
      why: row.why,
      hint: row.hint || ""
    };
  }

  const CARDS = [];
  EXAM_IDS.forEach(function (ex) {
    (BANK.exams[ex] || []).forEach(function (row) {
      CARDS.push(prep(row));
    });
  });
  const BY_ID = {};
  CARDS.forEach(function (c) { BY_ID[c.id] = c; });

  function toPlain(why) {
    const reps = [
      [/\bmSCP\b/g, "mSCP (the macOS Security Compliance Project)"],
      [/\bAPNs\b/g, "APNs (Apple's push service)"],
      [/\bMDM\b/g, "MDM (device management)"],
      [/\bADE\b/g, "ADE (Automated Device Enrollment)"],
      [/\bSMTP\b/g, "SMTP (the email-sending setting)"],
      [/\bJCDS\b/g, "JCDS (Jamf's cloud file server for packages)"],
      [/\bPPPC\b/g, "PPPC (privacy permission approvals)"],
      [/\bDDM\b/g, "DDM (Declarative Device Management)"],
      [/\bLDAP\b/g, "LDAP (a company directory)"],
      [/\bUDID\b/g, "UDID (a unique device identifier)"],
      [/\bSIP\b/g, "SIP (System Integrity Protection)"],
      [/\bSSO\b/g, "SSO (single sign-on)"],
      [/\bCSR\b/g, "CSR (a certificate request file)"],
      [/\bGSX\b/g, "GSX (Apple's service and warranty system)"],
      [/\bEAs\b/g, "extension attributes"]
    ];
    let s = why;
    for (let i = 0; i < reps.length; i++) s = s.replace(reps[i][0], reps[i][1]);
    return s;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function rich(s) {
    return escapeHtml(s).split("`").map(function (part, i) {
      return i % 2 === 1 ? "<code>" + part + "</code>" : part;
    }).join("");
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function mmss(s) {
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function emptyPractice() {
    const o = {};
    EXAM_IDS.forEach(function (ex) {
      o[ex] = { answers: {}, submitted: false, startedAt: 0 };
    });
    return o;
  }

  function loadSaved() {
    const base = { missed: [], close: [], bestStreak: 0, practice: emptyPractice() };
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return base;
      const p = JSON.parse(raw);
      const missed = Array.isArray(p.missed) ? p.missed.filter(function (x) { return typeof x === "string"; }) : [];
